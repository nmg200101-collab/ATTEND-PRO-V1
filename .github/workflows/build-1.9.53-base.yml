name: Build ATTEND-PRO 1.9.53 Base Connection Foundation

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Reconstruct 1.9.53 clean base source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifact buildsrc
          mkdir -p artifact buildsrc
          gh run download 34022338830 -R "${{ github.repository }}" -n ATTEND-PRO-V1-source-1.9.52-v3 -D artifact
          unzip -q artifact/ATTEND-PRO-V1-source-1.9.52.zip -d buildsrc
          base64 -d .source_patches/1.9.53/base.patch.xz.b64 | xz -dc > /tmp/1953.patch
          (cd buildsrc && patch -p4 --batch < /tmp/1953.patch)

      - name: Add connection foundation protocol tests
        run: |
          cat > buildsrc/core/src/test/java/com/attendpro/core/ConnectionFoundation1953Test.kt <<'EOF'
          package com.attendpro.core
          import org.junit.Assert.*
          import org.junit.Test

          class ConnectionFoundation1953Test {
              private val secret = ByteArray(32) { (it * 7 + 3).toByte() }

              @Test fun bleDirectPingAckConfirmIsEndToEndAuthenticated() {
                  val now = 1_780_000_000_000L
                  val ping = BleDirectProtocol.encodePing(secret, now, 0x12345678)
                  val decoded = BleDirectProtocol.decodePing(ping, secret, now)
                  assertNotNull(decoded)
                  val ack = BleDirectProtocol.encodeAck(secret, decoded!!.nonce, now + 300)
                  assertTrue(BleDirectProtocol.verifyAck(ack, secret, decoded.nonce, now + 300))
                  val confirm = BleDirectProtocol.encodeAckConfirm(secret, decoded.nonce, now + 600)
                  assertTrue(BleDirectProtocol.verifyAckConfirm(confirm, secret, decoded.nonce, now + 600))
                  assertFalse(BleDirectProtocol.verifyAck(confirm, secret, decoded.nonce, now + 600))
              }

              @Test fun lanPresenceAckConfirmBindsEmployeeAndProofToken() {
                  val now = 1_780_000_000_000L
                  val employeeId = "emp-foundation-1953"
                  val raw = BleProtocol.buildPayload(employeeId, secret, 0, now)
                  val payload = BleProtocol.parse(raw)!!
                  assertTrue(BleProtocol.verifyAuthenticated(payload, employeeId, secret, now))
                  val ack = LanAckProtocol.encode(payload.employeeHash, payload.token, secret, now + 100)
                  assertTrue(LanAckProtocol.verify(ack, payload.employeeHash, payload.token, secret, now + 100))
                  val confirm = LanConfirmProtocol.encode(payload.employeeHash, payload.token, secret, now + 200)
                  assertTrue(LanConfirmProtocol.verify(confirm, payload.employeeHash, payload.token, secret, now + 200))
                  assertFalse(LanConfirmProtocol.verify(confirm, payload.employeeHash, payload.token + 1, secret, now + 200))
              }

              @Test fun pairingProvisionSurvivesCompactTransportWithSecret() {
                  val encoded = SecretCodec.encode(secret)
                  val p = PairingProtocol.EmployeeProvision(
                      storeId="store-base", storeName="Store Base", employeeId="emp-base", displayName="Employee Base",
                      branchId="MAIN", phone="", jobTitle="", pairingSecret=encoded, pinHash="",
                      expiresAt=System.currentTimeMillis()+600000,
                      allowedMethods=setOf(AttendanceMethod.PHONE_BLE_BIOMETRIC.name), serverUrl="https://example.invalid"
                  )
                  val compact = PairingProtocol.encodeEmployeeProvisionCompact(p)
                  val decoded = PairingProtocol.decodeEmployeeProvision(compact)
                  assertNotNull(decoded)
                  assertEquals(p.storeId, decoded!!.storeId)
                  assertEquals(p.employeeId, decoded.employeeId)
                  assertEquals(p.pairingSecret, decoded.pairingSecret)
                  assertTrue(SecretCodec.isValid(decoded.pairingSecret))
              }
          }
          EOF

      - name: Static root-cause regression audit
        run: |
          set -euo pipefail
          grep -q 'versionCode = 60' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "1.9.53"' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionCode = 60' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "1.9.53"' buildsrc/store-app/build.gradle.kts
          ! grep -RIn 'pairingBridgeGeneration' buildsrc/employee-app/src/main buildsrc/store-app/src/main
          ! grep -RIn 'context as? Activity' buildsrc/employee-app/src/main/java/com/attendpro/employee/BlePresenceAdvertiser.kt
          grep -q 'BLUETOOTH_ADVERTISE' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'BLUETOOTH_CONNECT' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'BLUETOOTH_SCAN' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'directBle.touch(employee.employeeId, secret, device, directBleConfig())' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'finishFound(provisionText, "Wi‑Fi/Hotspot مباشر • ملف موثق")' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'finishFound(text, "Bluetooth مباشر • ملف موثق")' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'negotiatedMtu' buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'startBleChannelsIfPermitted()' buildsrc/employee-app/src/main/java/com/attendpro/employee/PresenceService.kt

      - name: Run core protocol tests
        run: gradle -p buildsrc :core:testDebugUnitTest --stacktrace

      - name: Compile both Android apps debug
        run: gradle -p buildsrc :employee-app:assembleDebug :store-app:assembleDebug --stacktrace

      - name: Build unsigned release APKs
        run: gradle -p buildsrc :employee-app:assembleRelease :store-app:assembleRelease --stacktrace

      - name: Verify packaged versions and manifests
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          EMP="buildsrc/employee-app/build/outputs/apk/release/employee-app-release-unsigned.apk"
          STORE="buildsrc/store-app/build/outputs/apk/release/store-app-release-unsigned.apk"
          test -s "$EMP"; test -s "$STORE"
          "$AAPT" dump badging "$EMP" | tee employee-badging.txt
          "$AAPT" dump badging "$STORE" | tee store-badging.txt
          grep -q "versionCode='60' versionName='1.9.53'" employee-badging.txt
          grep -q "versionCode='60' versionName='1.9.53'" store-badging.txt
          "$AAPT" dump permissions "$EMP" | tee employee-permissions.txt
          grep -q 'android.permission.BLUETOOTH_SCAN' employee-permissions.txt
          grep -q 'android.permission.BLUETOOTH_CONNECT' employee-permissions.txt
          grep -q 'android.permission.BLUETOOTH_ADVERTISE' employee-permissions.txt

      - name: Package 1.9.53 clean base source and audit
        run: |
          set -euo pipefail
          cat > CONNECTION-FOUNDATION-1.9.53.txt <<'EOF'
          ATTEND-PRO 1.9.53 BASE CONNECTION FOUNDATION
          - Store now actively starts authenticated direct GATT via directBle.touch after a valid employee HMAC advertisement.
          - Employee Bluetooth runtime permissions are owned by MainActivity, never requested from Service context.
          - LAN/server channels remain independent when Bluetooth permission is unavailable.
          - Valid full Store provisioning completes pairing immediately; reverse ACK is best effort, not a second failure gate.
          - Store pairing GATT provisioning uses MTU-aware chunks with an 18-byte safe default.
          - Stale pairingBridgeGeneration logic removed.
          - Protocol tests cover BLE PING->ACK->ACK-confirm, LAN HMAC->ACK->confirm, and AP4P provision roundtrip.
          EOF
          (cd buildsrc && zip -qr ../ATTEND-PRO-V1-source-1.9.53-BASE.zip . -x '.gradle/*' 'core/build/*' 'employee-app/build/*' 'store-app/build/*')
          sha256sum ATTEND-PRO-V1-source-1.9.53-BASE.zip > source-sha256.txt
          sha256sum buildsrc/employee-app/build/outputs/apk/release/employee-app-release-unsigned.apk > employee-unsigned-sha256.txt
          sha256sum buildsrc/store-app/build/outputs/apk/release/store-app-release-unsigned.apk > store-unsigned-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Employee-1.9.53-release-unsigned
          path: buildsrc/employee-app/build/outputs/apk/release/employee-app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Store-1.9.53-release-unsigned
          path: buildsrc/store-app/build/outputs/apk/release/store-app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-V1-source-1.9.53-BASE
          path: |
            ATTEND-PRO-V1-source-1.9.53-BASE.zip
            CONNECTION-FOUNDATION-1.9.53.txt
            source-sha256.txt
            employee-unsigned-sha256.txt
            store-unsigned-sha256.txt
            employee-badging.txt
            store-badging.txt
            employee-permissions.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-apksigner-35
          path: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
