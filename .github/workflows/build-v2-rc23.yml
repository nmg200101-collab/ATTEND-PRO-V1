name: Build ATTEND-PRO V134 Complete DNS Recovery
on:
  push:
    branches: [attend-pro-v134-complete-dns-recovery]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 -print -quit || true)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Verify V134 native source
        run: |
          set -euo pipefail
          REPORTS=buildsrc/store-app/src/main/java/com/attendpro/store/ReportsActivity.kt
          CENTER=buildsrc/store-app/src/main/java/com/attendpro/store/StoreReceiverPermissionsActivity.kt
          MANIFEST=buildsrc/store-app/src/main/AndroidManifest.xml
          test -f "$CENTER"
          grep -q 'هواتف الاستلام والصلاحيات' "$REPORTS"
          grep -q 'StoreReceiverPermissionsActivity::class.java' "$REPORTS"
          grep -q 'هواتف الاستلام والصلاحيات' "$CENTER"
          grep -q 'الهواتف' "$CENTER"
          grep -q 'إضافة هاتف' "$CENTER"
          grep -q 'الصلاحيات' "$CENTER"
          grep -q 'استلام التقارير' "$CENTER"
          grep -q 'مراسلة الموظفين' "$CENTER"
          grep -q 'إدارة الموظفين' "$CENTER"
          grep -q 'حفظ التغييرات' "$CENTER"
          grep -q 'setReportReceiverPermissions' "$CENTER"
          grep -q 'setReceiverPermissions' "$CENTER"
          grep -q 'StoreReceiverPermissionsActivity' "$MANIFEST"
          MAIN=buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'استعادة التفعيل تلقائيًا' "$MAIN"
          grep -q 'تسجيل محل جديد مباشرة — تجربة 3 أيام' "$MAIN"
          grep -q 'activationConnectionMessage' "$MAIN"
          grep -q 'isDnsResolutionError' "$MAIN"
          grep -q 'showDnsRecoveryDialog' "$MAIN"
          grep -q 'android.settings.PRIVATE_DNS_SETTINGS' "$MAIN"
          grep -q 'startAutomaticActivationRecovery' "$MAIN"
          grep -q 'forceCentralActivationRecovery' "$MAIN"
          grep -q 'restoreCentralActivationSmart' "$MAIN"
          grep -q '1/3 التحقق من التفعيل المحفوظ' "$MAIN"
          grep -q '2/3 فحص طلب التفعيل السابق' "$MAIN"
          grep -q '3/3 التعرف على الجهاز من الخادم' "$MAIN"
          grep -q 'CentralServerClient.validateStore' "$MAIN"
          grep -q 'CentralServerClient.activationStatus' "$MAIN"
          grep -q 'CentralServerClient.recoverActivation' "$MAIN"
          DNS=buildsrc/core/src/main/java/com/attendpro/core/ResilientHttp.kt
          test -f "$DNS"
          grep -q 'SecureFallbackDns' "$DNS"
          grep -q 'https://1.1.1.1/dns-query' "$DNS"
          grep -q 'https://8.8.8.8/resolve' "$DNS"
          grep -q 'ResilientHttp.execute' buildsrc/core/src/main/java/com/attendpro/core/CentralServerClient.kt
          grep -q 'ResilientHttp.execute' buildsrc/core/src/main/java/com/attendpro/core/ReceiverEmployeeAdminClient.kt
          grep -q 'com.squareup.okhttp3:okhttp:4.12.0' buildsrc/core/build.gradle.kts
          grep -q 'attemptId != activationRecoveryAttemptId' "$MAIN"
          grep -q 'جاري استعادة التفعيل السابق تلقائيًا' "$MAIN"
          ! grep -q 'syncRemoteControlIfDue()' "$MAIN"
          SETTINGS=buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          RECEIVER=buildsrc/store-app/src/main/java/com/attendpro/store/ReportReceiverActivity.kt
          grep -q 'هواتف الاستلام والصلاحيات' "$SETTINGS"
          grep -q 'StoreReceiverPermissionsActivity::class.java' "$SETTINGS"
          grep -q 'هاتف الاستلام وإدارة الموظفين' "$RECEIVER"
          grep -q 'الموظفون والرسائل' "$RECEIVER"
          ! grep -q 'هاتف الاستلام وإدارة المحل' "$RECEIVER"
          grep -q 'تعذر العثور على عنوان الخادم عبر DNS' "$MAIN"
          ! grep -q 'إعدادات مدير المحل' "$CENTER"
          ! grep -q 'python3 tools/unify-report-receiver-center.py' .github/workflows/build-v2-rc23.yml
          grep -q 'versionCode = 134' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-DNS-RECOVERY2"' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 134' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-DNS-RECOVERY2"' buildsrc/employee-app/build.gradle.kts
          git diff --exit-code 7c9c8aeb8316da5334096820bf3fe16f45f8a630 -- \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt \
            buildsrc/core/src/main/java/com/attendpro/core/BleDirectProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/BleProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/PairingAckProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/PairingProtocol.kt \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/BlePresenceAdvertiser.kt \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/BleDirectLinkServer.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/BleEmployeeScanner.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/BleDirectLinkClient.kt
      - name: Verify secure DNS bootstrap
        run: |
          set -euo pipefail
          HOST='attend-pro-central.nmg200101.workers.dev'
          OUT=$(curl -fsS --connect-timeout 8 --max-time 12 -H 'accept: application/dns-json' "https://1.1.1.1/dns-query?name=$HOST&type=A" || true)
          echo "CF_A=$OUT"
          OUT6=$(curl -fsS --connect-timeout 8 --max-time 12 -H 'accept: application/dns-json' "https://1.1.1.1/dns-query?name=$HOST&type=AAAA" || true)
          echo "CF_AAAA=$OUT6"
          G=$(curl -fsS --connect-timeout 8 --max-time 12 -H 'accept: application/dns-json' "https://8.8.8.8/resolve?name=$HOST&type=A" || true)
          echo "GOOGLE_A=$G"
          if ! printf '%s\n%s' "$OUT" "$G" | grep -Eq '"data"[[:space:]]*:[[:space:]]*"[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+"'; then
            printf '%s' "$OUT6" | grep -Eq '"data"[[:space:]]*:[[:space:]]*"[0-9A-Fa-f:]+"'
          fi

      - name: Test and build
        run: gradle -p buildsrc :core:testDebugUnitTest :foundation:testDebugUnitTest :store-app:testDirectDebugUnitTest :employee-app:testDirectDebugUnitTest :store-app:assembleDirectRelease :employee-app:assembleDirectRelease --stacktrace
      - name: Sign V134
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir signed
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode >/tmp/a.jks
          EXPECTED=2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59
          for APP in employee store; do
            if [ "$APP" = employee ]; then
              MOD=employee-app; PKG=com.attendpro.employee; OUT=ATTEND-PRO-Employee-V134.apk
            else
              MOD=store-app; PKG=com.attendpro.store; OUT=ATTEND-PRO-Store-V134.apk
            fi
            U=$(find buildsrc/$MOD/build/outputs/apk/direct/release -name '*-unsigned.apk' -print -quit)
            test -n "$U"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$U" /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks /tmp/a.jks \
              --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" \
              --ks-pass env:ATTEND_PRO_STORE_PASSWORD \
              --key-pass env:ATTEND_PRO_KEY_PASSWORD \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out signed/$OUT /tmp/$APP.apk
            CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs signed/$OUT | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
            test "$CERT" = "$EXPECTED"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging signed/$OUT | grep -q "package: name='$PKG' versionCode='134' versionName='2.0.0-RC29-DNS-RECOVERY2'"
          done
          (cd signed && sha256sum *.apk > ALL-SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-V134-COMPLETE-DNS-RECOVERY-SIGNED
          path: signed/
          retention-days: 30
