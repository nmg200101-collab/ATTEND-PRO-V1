name: Build ATTEND-PRO V164 Store Logo Import Header Compact
on:
  push:
    branches: [attend-pro-v157-bluetooth-dual-path-stability, attend-pro-v158-store-management-ux, attend-pro-v159-store-management-entry-fix, attend-pro-v160-store-management-routes-fix, attend-pro-v161-store-management-compact-back, attend-pro-v162-store-management-visual-status, attend-pro-v163-store-profile-branding, attend-pro-v164-store-logo-import-header-compact]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Enforce comprehensive V157 functional lock
        run: |
          set -euo pipefail
          ANCHOR="575f4dddc77ae025574caba3321d6990e102c216"
          git cat-file -e "$ANCHOR^{commit}"
          failed=0
          for commit in $(git rev-list --reverse "$ANCHOR"..HEAD); do
            changed="$(git diff-tree --no-commit-id --name-only -r "$commit" -- buildsrc .source_patches tools || true)"
            [ -z "$changed" ] && continue
            message="$(git log -1 --pretty=%B "$commit")"
            if ! printf '%s\n' "$message" | grep -Fxq 'USER-DIRECT-APPROVAL: YES'; then
              echo "::error::Locked functional code changed in $commit without USER-DIRECT-APPROVAL: YES"
              printf '%s\n' "$changed"
              failed=1
            fi
            if ! printf '%s\n' "$message" | grep -Fxq 'LOCK-WARNING-SHOWN: YES'; then
              echo "::error::Locked functional code changed in $commit without LOCK-WARNING-SHOWN: YES"
              failed=1
            fi
            scope="$(printf '%s\n' "$message" | sed -n 's/^LOCK-SCOPE:[[:space:]]*//p' | head -n1)"
            if [ -z "$scope" ]; then
              echo "::error::Locked functional code changed in $commit without LOCK-SCOPE"
              failed=1
            else
              echo "Authorized locked change $commit — scope: $scope"
            fi
          done
          test "$failed" -eq 0
          test -f ALL-SECTIONS-FINAL-LOCK-V157.md
          test -f BLUETOOTH-FINAL-LOCK-V157.md
          test -f RECEIVER-FINAL-LOCK-V149.md
          test -f CONNECTION_CORE_FINAL_LOCK_RC29.md
      - name: Apply V156 targeted source patch
        run: |
          set -euo pipefail
          cat .source_patches/v156/source.patch.xz.b64.part{0,1,2,3,4,5} > /tmp/v156-source.patch.xz.b64
          test "$(sha256sum /tmp/v156-source.patch.xz.b64 | awk '{print $1}')" = "7e07f7fb7901c628a4e725f363b684ad2fc13ee4c5c732603070b4432cfb66d9"
          base64 -d /tmp/v156-source.patch.xz.b64 | xz -d > /tmp/v156-source.patch
          patch -p1 --forward --batch < /tmp/v156-source.patch
          cp .source_patches/v156/lock-fix.patch.xz.b64 /tmp/v156-lock-fix.patch.xz.b64
          test "$(sha256sum /tmp/v156-lock-fix.patch.xz.b64 | awk '{print $1}')" = "7a627cae04fb7b49375c81d8bd99e2250d4a30f56d660b37c12fc64483f22d26"
          base64 -d /tmp/v156-lock-fix.patch.xz.b64 | xz -d > /tmp/v156-lock-fix.patch
          patch -p1 --forward --batch < /tmp/v156-lock-fix.patch
          grep -q 'versionCode = 156' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 156' buildsrc/employee-app/build.gradle.kts
          test -f buildsrc/core/src/main/java/com/attendpro/core/LanLocalMessageProtocolV156.kt
          test -f buildsrc/store-app/src/main/java/com/attendpro/store/StoreLanMessagingRuntimeV156.kt
          test -f buildsrc/employee-app/src/main/java/com/attendpro/employee/EmployeeLanMessagingRuntimeV156.kt
          test -f buildsrc/core/src/main/java/com/attendpro/core/MessageHistoryClientV156.kt
      - name: Apply V157 Bluetooth dual-path stability patch
        run: |
          set -euxo pipefail
          cp .source_patches/v157/source.patch.xz.b64 /tmp/v157-source.patch.xz.b64
          test "$(sha256sum /tmp/v157-source.patch.xz.b64 | awk '{print $1}')" = "d0c046895e41aef87282e3187dc82d8497e465b8ad69ba047ea6b8e40bcaed1f"
          base64 -d /tmp/v157-source.patch.xz.b64 | xz -d > /tmp/v157-source.patch
          test "$(sha256sum /tmp/v157-source.patch | awk '{print $1}')" = "8e0e8b93438365404c764e4af2164320fc6059d28cdb864fddb8d8b62722f660"
          patch -p1 --forward --batch < /tmp/v157-source.patch
          grep -q 'versionCode = 157' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 157' buildsrc/employee-app/build.gradle.kts
          test -f buildsrc/core/src/main/java/com/attendpro/core/ReverseBlePresenceProtocolV157.kt
          test -f buildsrc/core/src/test/java/com/attendpro/core/ReverseBlePresenceProtocolV157Test.kt
          test -f buildsrc/store-app/src/main/java/com/attendpro/store/StoreReverseBluetoothPresenceServiceV157.kt
          test -f buildsrc/store-app/src/main/java/com/attendpro/store/ReverseBluetoothPresenceStateV157.kt
          test -f buildsrc/store-app/src/main/java/com/attendpro/store/StoreReverseBluetoothBootReceiverV157.kt
          test -f buildsrc/employee-app/src/main/java/com/attendpro/employee/EmployeeReverseBluetoothPresenceServiceV157.kt
          test -f RELEASE-NOTES-V157.md
          test -f V157-BLUETOOTH-DUAL-PATH-STABILITY.md
          cp .source_patches/v157/lint-fix.patch.xz.b64 /tmp/v157-lint-fix.patch.xz.b64
          test "$(sha256sum /tmp/v157-lint-fix.patch.xz.b64 | awk '{print $1}')" = "4e58ac6c6a97aa07bfa5cfabaa674710e08fb5d5333655598da92a73e35951ba"
          base64 -d /tmp/v157-lint-fix.patch.xz.b64 | xz -d > /tmp/v157-lint-fix.patch
          test "$(sha256sum /tmp/v157-lint-fix.patch | awk '{print $1}')" = "92913195cb2a7fcfcb88ce04a4ad0c9968e36524e1a2d0fca665ada88743a926"
          patch -p1 --forward --batch < /tmp/v157-lint-fix.patch
          grep -q 'val canConnect = Build.VERSION.SDK_INT < Build.VERSION_CODES.S' buildsrc/employee-app/src/main/java/com/attendpro/employee/EmployeeReverseBluetoothPresenceServiceV157.kt
      - name: Apply V158 Store Management UX patch
        run: |
          set -euxo pipefail
          cp .source_patches/v158/source.patch.xz.b64 /tmp/v158-source.patch.xz.b64
          test "$(sha256sum /tmp/v158-source.patch.xz.b64 | awk '{print $1}')" = "706405037c5c8dbfbff698498bf9e767ce22cb6cd2700a9f05a6f3a6db43bfb9"
          base64 -d /tmp/v158-source.patch.xz.b64 | xz -d > /tmp/v158-source.patch
          test "$(sha256sum /tmp/v158-source.patch | awk '{print $1}')" = "518e8ba14ef98cc7366549bf717485133a81341df2b9d14072fc9558b7d5636a"
          patch -p1 --forward --batch < /tmp/v158-source.patch
          grep -q 'versionCode = 158' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V158-STORE-MANAGEMENT-UX"' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 158' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V158-STORE-MANAGEMENT-UX"' buildsrc/employee-app/build.gradle.kts
          grep -q 'showStoreSettingsV158' buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          grep -q 'showEmployeesAndShiftV158' buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          grep -q 'showConnectionReadinessV158' buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          grep -q 'showReportsReceptionV158' buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          grep -q 'showCommunicationV158' buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          grep -q 'showBackupSystemV158' buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          test -f RELEASE-NOTES-V158.md
          test -f V158-STORE-MANAGEMENT-UX.md
      - name: Apply V159 Store Management entry fix patch
        run: |
          set -euxo pipefail
          cp .source_patches/v159/source.patch.xz.b64 /tmp/v159-source.patch.xz.b64
          test "$(sha256sum /tmp/v159-source.patch.xz.b64 | awk '{print $1}')" = "627aa0dd3edc94b849085b8c4d9d33d8498dbf25ad2d705281dddb9dc937f7e2"
          base64 -d /tmp/v159-source.patch.xz.b64 | xz -d > /tmp/v159-source.patch
          test "$(sha256sum /tmp/v159-source.patch | awk '{print $1}')" = "c7025ce72681fc08ba94c057ab86071b2e024dcf373e980bf6f814ab1f02bce4"
          patch -p1 --forward --batch < /tmp/v159-source.patch
          sed -i 's/versionCode = 158/versionCode = 159/' buildsrc/store-app/build.gradle.kts
          sed -i 's/versionName = "2.0.0-RC29-V158-STORE-MANAGEMENT-UX"/versionName = "2.0.0-RC29-V159-STORE-MANAGEMENT-ENTRY-FIX"/' buildsrc/store-app/build.gradle.kts
          sed -i 's/versionCode = 158/versionCode = 159/' buildsrc/employee-app/build.gradle.kts
          sed -i 's/versionName = "2.0.0-RC29-V158-STORE-MANAGEMENT-UX"/versionName = "2.0.0-RC29-V159-STORE-MANAGEMENT-ENTRY-FIX"/' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionCode = 159' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V159-STORE-MANAGEMENT-ENTRY-FIX"' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 159' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V159-STORE-MANAGEMENT-ENTRY-FIX"' buildsrc/employee-app/build.gradle.kts
          grep -q 'requireStoreOwner("إدارة المحل"){startActivity(Intent(this@MainActivity,StoreSettingsActivity::class.java))}' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          test -f RELEASE-NOTES-V159.md
          test -f V159-STORE-MANAGEMENT-ENTRY-FIX.md
      - name: Apply V160 Store Management routes fix patch
        run: |
          set -euxo pipefail
          cp .source_patches/v160/source.patch.xz.b64 /tmp/v160-source.patch.xz.b64
          test "$(sha256sum /tmp/v160-source.patch.xz.b64 | awk '{print $1}')" = "1286b911bbff9f379cf9813216b69007dee64aaea33d6bf129a3e15b81f0122c"
          base64 -d /tmp/v160-source.patch.xz.b64 | xz -d > /tmp/v160-source.patch
          test "$(sha256sum /tmp/v160-source.patch | awk '{print $1}')" = "cccac77fdf9743e3f110f25da0d8ccfef62e798afc38038a6f8ce329479263da"
          patch -p1 --forward --batch < /tmp/v160-source.patch
          grep -q 'versionCode = 160' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V160-STORE-MANAGEMENT-ROUTES-FIX"' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 160' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V160-STORE-MANAGEMENT-ROUTES-FIX"' buildsrc/employee-app/build.gradle.kts
          MAIN=buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'row.addView(tab("الإدارة") { requireStoreOwner("إدارة المحل") { startActivity(Intent(this@MainActivity, StoreSettingsActivity::class.java)) } })' "$MAIN"
          grep -q 'requireStoreOwner(t("إدارة المحل", "Store Management")) { startActivity(Intent(this@MainActivity, StoreSettingsActivity::class.java)) }' "$MAIN"
          grep -q '"all_settings" -> startActivity(Intent(this, StoreSettingsActivity::class.java))' "$MAIN"
          test "$(grep -c 'showStoreOwnerHub()' "$MAIN")" -eq 1
          test -f RELEASE-NOTES-V160.md
          test -f V160-STORE-MANAGEMENT-ROUTES-FIX.md
      - name: Apply V161 compact Store Management and sequential back patch
        run: |
          set -euxo pipefail
          EXPECTED_PARTS=(
            b29e16dd45dec848d865a652456f8825dbaabf4e788ae6fbdcf9c7cd26654db4
            ec870e91f985a87614675474937941e2be65c943e57032ac8c3e3ad1ac7ab7d2
            7c6382c6653748423df273e4ff0990a1a6acc78c6e40b0c001d70f0f42fd2b7a
            1234f705719b65c2fed5e4de1996a1d486714ee1938355b16720c431c0452811
            04fdbe794f1bc81b877f222dbcf6dc4af8d8dd955bbba7f897c179c81a6595f3
            b4c7b051d2cbf2306626befa4c4b1a3f0912dd25759751207a6c98faca79b5de
            56dc3354578a1d80290515ca745d6dc3ecfcd0fe4d0d543f8346239c3232afa7
            aee9b7a2f385388c55b23754d1debf268dd8baa756281e4c3eb831cf5498ce14
            72b3d1fe71cf0ecd7925c0db1a28b6b4199cafecd6dc7c0be4b4fe6e7ee47190
            a2344ef18e6f1734dacb57f47696b6b74a52236465f10be304ad53c97c8dc356
            5e7b8ecd531f7c8a936cee92b73f89375796c9c129f5aa46e4d343db432f20cd
            c742ac0e0ed917acd7810eb342ace1515e6cabce4e02100ee0456b893adb9e0e
          )
          : > /tmp/v161-source.patch.xz.b64
          for i in $(seq 0 11); do
            P=".source_patches/v161/exact.part$(printf '%02d' "$i")"
            NORMALIZED="/tmp/v161-part-$i"
            tr -d '\r\n\t ' < "$P" > "$NORMALIZED"
            test "$(sha256sum "$NORMALIZED" | awk '{print $1}')" = "${EXPECTED_PARTS[$i]}"
            cat "$NORMALIZED" >> /tmp/v161-source.patch.xz.b64
          done
          test "$(sha256sum /tmp/v161-source.patch.xz.b64 | awk '{print $1}')" = "5933c7745267294858818a551aec764104ac11e94bab1794fe196e8cb5869ca6"
          base64 -d /tmp/v161-source.patch.xz.b64 | xz -d > /tmp/v161-source.patch
          test "$(sha256sum /tmp/v161-source.patch | awk '{print $1}')" = "6636c433697573d3991df0a5d438bf307eea4ba9913dda583d3c46d126714af3"
          patch -p1 --forward --batch < /tmp/v161-source.patch
          grep -q 'versionCode = 161' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V161-STORE-MANAGEMENT-COMPACT-BACK"' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 161' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V161-STORE-MANAGEMENT-COMPACT-BACK"' buildsrc/employee-app/build.gradle.kts
          SETTINGS=buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          grep -q 'private enum class StorePageV161' "$SETTINGS"
          grep -q 'private fun compactRowV161' "$SETTINGS"
          grep -q 'private fun settingsGroupV161' "$SETTINGS"
          grep -q 'private fun returnOneLevelV161' "$SETTINGS"
          grep -q 'renderCurrentPageV161()' "$SETTINGS"
          test -f RELEASE-NOTES-V161.md
          test -f V161-STORE-MANAGEMENT-FUNCTION-AUDIT.md
      - name: Apply V162 Store Management visual status patch
        run: |
          set -euxo pipefail
          cp .source_patches/v162/source.patch.xz.b64 /tmp/v162-source.patch.xz.b64
          tr -d '\r\n\t ' < /tmp/v162-source.patch.xz.b64 > /tmp/v162-source.patch.normalized.b64
          test "$(sha256sum /tmp/v162-source.patch.normalized.b64 | awk '{print $1}')" = "f0ef266ba032fa273764d28b01317e5e9aa5c050fe36f0cd69555c4290127c22"
          base64 -d /tmp/v162-source.patch.normalized.b64 | xz -d > /tmp/v162-source.patch
          test "$(sha256sum /tmp/v162-source.patch | awk '{print $1}')" = "ea8804d962e8a4641bfde4bf33a77659736966f63293dd6a1db005b2f7df8144"
          patch -p1 --forward --batch < /tmp/v162-source.patch
          grep -q 'versionCode = 162' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V162-STORE-MANAGEMENT-VISUAL-STATUS"' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 162' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V162-STORE-MANAGEMENT-VISUAL-STATUS"' buildsrc/employee-app/build.gradle.kts
          SETTINGS=buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          grep -q 'private enum class StatusToneV162' "$SETTINGS"
          grep -q 'private fun settingIconV162' "$SETTINGS"
          grep -q 'private fun statusChipV162' "$SETTINGS"
          grep -q 'private fun sectionSummaryV162' "$SETTINGS"
          grep -q 'private fun bluetoothRadioStatusV162' "$SETTINGS"
          grep -q 'private fun wifiStatusV162' "$SETTINGS"
          grep -q 'private fun connectionSummaryV162' "$SETTINGS"
          test -f RELEASE-NOTES-V162.md
          test -f V162-STORE-MANAGEMENT-STATUS-AUDIT.md
      - name: Snapshot V162 background runtime before V163
        run: |
          set -euo pipefail
          BG_FILES=(
            buildsrc/store-app/src/main/AndroidManifest.xml
            buildsrc/store-app/src/main/java/com/attendpro/store/StoreReverseBluetoothPresenceServiceV157.kt
            buildsrc/store-app/src/main/java/com/attendpro/store/StoreReverseBluetoothBootReceiverV157.kt
            buildsrc/store-app/src/main/java/com/attendpro/store/ReceiverReportService.kt
            buildsrc/store-app/src/main/java/com/attendpro/store/PresenceProofControlActivity.kt
            buildsrc/store-app/src/main/java/com/attendpro/store/StoreMessagePoll1975.kt
            buildsrc/employee-app/src/main/AndroidManifest.xml
            buildsrc/employee-app/src/main/java/com/attendpro/employee/PresenceService.kt
            buildsrc/employee-app/src/main/java/com/attendpro/employee/EmployeeReverseBluetoothPresenceServiceV157.kt
            buildsrc/employee-app/src/main/java/com/attendpro/employee/PresenceBootReceiver.kt
            buildsrc/employee-app/src/main/java/com/attendpro/employee/EmployeeMessageFastPoller142.kt
          )
          sha256sum "${BG_FILES[@]}" > /tmp/v163-background-before.sha256
      - name: Apply V163 store profile branding patch
        run: |
          set -euxo pipefail
          cp .source_patches/v163/source.patch.xz.b64 /tmp/v163-source.patch.xz.b64
          tr -d '\r\n\t ' < /tmp/v163-source.patch.xz.b64 > /tmp/v163-source.patch.normalized.b64
          test "$(sha256sum /tmp/v163-source.patch.normalized.b64 | awk '{print $1}')" = "24cea14a1ac2d8427262a41fd6f12325b62d5c2973439e4eff44be500da96a3f"
          base64 -d /tmp/v163-source.patch.normalized.b64 | xz -d > /tmp/v163-source.patch
          test "$(sha256sum /tmp/v163-source.patch | awk '{print $1}')" = "8e1b8fc7b7fffc5b1ccdccb1705b8726ea69cd0cb7294d5805cc7b157887c49a"
          patch -p1 --forward --batch < /tmp/v163-source.patch
          grep -q 'versionCode = 163' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V163-STORE-PROFILE-BRANDING"' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 163' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V163-STORE-PROFILE-BRANDING"' buildsrc/employee-app/build.gradle.kts
          SETTINGS=buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          MAIN=buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          REPO=buildsrc/core/src/main/java/com/attendpro/core/LocalStores.kt
          grep -q 'var storeLogoMode' "$REPO"
          grep -q 'var storeLogoPath' "$REPO"
          grep -q 'var storeLogoSymbol' "$REPO"
          grep -q 'showStoreBrandingV163' "$SETTINGS"
          grep -q 'saveStoreLogoFromUriV163' "$SETTINGS"
          grep -q 'ACTION_OPEN_DOCUMENT' "$SETTINGS"
          grep -q 'addStoreIdentityToHeroV163' "$MAIN"
          grep -q 'storeBrandViewV163' "$MAIN"
          sha256sum -c /tmp/v163-background-before.sha256
          test -f RELEASE-NOTES-V163.md
          test -f V163-BACKGROUND-READINESS-AUDIT.md
      - name: Apply V164 store logo import and compact header patch
        run: |
          set -euxo pipefail
          cp .source_patches/v164/source.patch.xz.b64 /tmp/v164-source.patch.xz.b64
          tr -d '\r\n\t ' < /tmp/v164-source.patch.xz.b64 > /tmp/v164-source.patch.normalized.b64
          test "$(sha256sum /tmp/v164-source.patch.normalized.b64 | awk '{print $1}')" = "3977ba55a13daeff967f95fb3694f01c30f593b1972f8c4a198f47dc937061ec"
          base64 -d /tmp/v164-source.patch.normalized.b64 | xz -d > /tmp/v164-source.patch
          test "$(sha256sum /tmp/v164-source.patch | awk '{print $1}')" = "4f05c230e666d8e436bf0383e273e0cc42eccbee0bb92e86c9fbd8692fa911cc"
          patch -p1 --forward --batch < /tmp/v164-source.patch
          grep -q 'versionCode = 164' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V164-STORE-LOGO-IMPORT-HEADER-COMPACT"' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 164' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V164-STORE-LOGO-IMPORT-HEADER-COMPACT"' buildsrc/employee-app/build.gradle.kts
          SETTINGS=buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          MAIN=buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'ACTION_GET_CONTENT' "$SETTINGS"
          grep -q 'store_logo_import.tmp' "$SETTINGS"
          grep -q 'input.copyTo(output, 64 \* 1024)' "$SETTINGS"
          grep -q 'storeIdentityInlineV164' "$MAIN"
          ! grep -q 'addStoreIdentityToHeroV163' "$MAIN"
          sha256sum -c /tmp/v163-background-before.sha256
          test -f RELEASE-NOTES-V164.md
          test -f V164-STORE-LOGO-HEADER-AUDIT.md
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 -print -quit || true)
          test -n "$SDKMANAGER"
