            :store-app:testDirectDebugUnitTest \
            :employee-app:testDirectDebugUnitTest \
            :store-app:lintDirectRelease \
            :employee-app:lintDirectRelease \
            :store-app:lintPlayRelease \
            :employee-app:lintPlayRelease \
            :store-app:assembleDirectRelease \
            :employee-app:assembleDirectRelease \
            :store-app:bundlePlayRelease \
            :employee-app:bundlePlayRelease \
            --stacktrace
      - name: Enforce V164 lint gate
        run: |
          set -euo pipefail
          ERRORS=/tmp/v164-lint-errors.txt
          : > "$ERRORS"
          while IFS= read -r report; do
            grep -E ' Error: ' "$report" >> "$ERRORS" || true
          done < <(find buildsrc -type f -name 'lint-results-*.txt' -print | sort)

          echo "===== Android lint errors (if any) ====="
          cat "$ERRORS" || true

          BAD=0
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            case "$line" in
              *"PairingDiscovery.kt:"*|              *"PairingBeacon.kt:"*|              *"BleDirectProtocol.kt:"*|              *"BleProtocol.kt:"*|              *"PairingAckProtocol.kt:"*|              *"PairingProtocol.kt:"*|              *"BlePresenceAdvertiser.kt:"*|              *"BleDirectLinkServer.kt:"*|              *"BleEmployeeScanner.kt:"*|              *"BleDirectLinkClient.kt:"*|              *"PresenceService.kt:"*|              *"ReportReceiverActivity.kt:"*|              *"ReceiverReportService.kt:"*|              *"ReceiverReportLanTransport.kt:"*|              *"ReceiverReportBleTransport.kt:"*|              *"StoreReceiverPermissionsActivity.kt:"*|              *"ReportProtocol.kt:"*|              *"ReceiverOfflineReportProtocol.kt:"*|              *"ReceiverEmployeeAdminClient.kt:"*|              *"CentralServerClient.kt:"*)
                echo "::notice::Pre-existing lint finding in immutable RC29/V149 source: $line"
                ;;
              *)
                echo "::error::V164 lint error outside immutable lock: $line"
                BAD=1
                ;;
            esac
          done < "$ERRORS"
          test "$BAD" -eq 0

      - name: Sign V164 APKs and Play AABs
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir signed
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode >/tmp/a.jks
          EXPECTED=2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59
          for APP in employee store; do
            if [ "$APP" = employee ]; then
              MOD=employee-app; PKG=com.attendpro.employee
              APK_OUT=ATTEND-PRO-Employee-V164.apk; AAB_OUT=ATTEND-PRO-Employee-V164-PLAY.aab
            else
              MOD=store-app; PKG=com.attendpro.store
              APK_OUT=ATTEND-PRO-Store-V164.apk; AAB_OUT=ATTEND-PRO-Store-V164-PLAY.aab
            fi
            U=$(find buildsrc/$MOD/build/outputs/apk/direct/release -name '*-unsigned.apk' -print -quit)
            test -n "$U"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$U" /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks /tmp/a.jks --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" --ks-pass env:ATTEND_PRO_STORE_PASSWORD --key-pass env:ATTEND_PRO_KEY_PASSWORD --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out signed/$APK_OUT /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs signed/$APK_OUT
            CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs signed/$APK_OUT | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
            test "$CERT" = "$EXPECTED"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging signed/$APK_OUT | grep -q "package: name='$PKG' versionCode='164' versionName='2.0.0-RC29-V164-STORE-LOGO-IMPORT-HEADER-COMPACT'"
            BUNDLE=$(find buildsrc/$MOD/build/outputs/bundle/playRelease -name '*.aab' -print -quit)
            test -n "$BUNDLE"
            jarsigner -keystore /tmp/a.jks -storepass:env ATTEND_PRO_STORE_PASSWORD -keypass:env ATTEND_PRO_KEY_PASSWORD -signedjar signed/$AAB_OUT "$BUNDLE" "$ATTEND_PRO_KEY_ALIAS"
            jarsigner -verify signed/$AAB_OUT | grep -q 'jar verified'
          done
          cp RELEASE-NOTES-V164.md signed/
          cp V164-STORE-LOGO-HEADER-AUDIT.md signed/
          cp RELEASE-NOTES-V163.md signed/
          cp V163-BACKGROUND-READINESS-AUDIT.md signed/
          cp ALL-SECTIONS-FINAL-LOCK-V157.md signed/
          cp BLUETOOTH-FINAL-LOCK-V157.md signed/
          cp RECEIVER-FINAL-LOCK-V149.md signed/
          cp CONNECTION_CORE_FINAL_LOCK_RC29.md signed/
          zip -qr signed/ATTEND-PRO-V164-SOURCE.zip . -x '.git/*' 'signed/*' 'buildsrc/.gradle/*' 'buildsrc/*/build/*' 'buildsrc/*/*/build/*'
          cat > signed/V164-AUTOMATED-QA.txt <<EOF
          ATTEND-PRO V164 — AUTOMATED QA
          Commit: $GITHUB_SHA
          Branch: $GITHUB_REF_NAME
          Version code: 164
          Version name: 2.0.0-RC29-V164-STORE-LOGO-IMPORT-HEADER-COMPACT
          Scope: store logo import fix + compact main blue header only
          V162 Store Management baseline: PRESERVED
          V157 Bluetooth dual-path baseline: LOCKED
          V149 Receiver baseline: LOCKED
          RC29 protected connection sources: LOCKED
          Background runtime files: BYTE-IDENTICAL
          Unit tests and Android lint: PASSED before this file was generated
          Direct APK and Play AAB signature/package verification: PASSED
          FIELD DEVICE GATE: verify Gallery/Files image import, logo persistence and blue-header height on the real Store device.
          EOF
          (cd signed && sha256sum *.apk *.aab *.zip RELEASE-NOTES-V164.md V164-STORE-LOGO-HEADER-AUDIT.md V164-AUTOMATED-QA.txt > ALL-SHA256SUMS.txt)
          cat signed/ALL-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-V164-STORE-LOGO-IMPORT-HEADER-COMPACT-SIGNED
          path: signed/
          retention-days: 90
