name: Build ATTEND-PRO V155 Final QA Release Hardening
on:
  push:
    branches: [attend-pro-v155-final-qa-release-hardening]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -111 -print -quit || true)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Verify V155 final QA release hardening locks
        run: |
          set -euo pipefail
          REPORTS=buildsrc/store-app/src/main/java/com/attendpro/store/ReportsActivity.kt
          CENTER=buildsrc/store-app/src/main/java/com/attendpro/store/StoreReceiverPermissionsActivity.kt
          MAIN=buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          RECEIVER=buildsrc/store-app/src/main/java/com/attendpro/store/ReportReceiverActivity.kt
          ADMIN=buildsrc/core/src/main/java/com/attendpro/core/ReceiverEmployeeAdminClient.kt
          CENTRAL=buildsrc/core/src/main/java/com/attendpro/core/CentralServerClient.kt
          PROTOCOL=buildsrc/core/src/main/java/com/attendpro/core/ReportProtocol.kt
          OFFLINE_PROTOCOL=buildsrc/core/src/main/java/com/attendpro/core/ReceiverOfflineReportProtocol.kt
          LAN_REPORT=buildsrc/store-app/src/main/java/com/attendpro/store/ReceiverReportLanTransport.kt
          BLE_REPORT=buildsrc/store-app/src/main/java/com/attendpro/store/ReceiverReportBleTransport.kt
          SERVICE=buildsrc/store-app/src/main/java/com/attendpro/store/ReceiverReportService.kt
          DNS=buildsrc/core/src/main/java/com/attendpro/core/ResilientHttp.kt
          SETTINGS=buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          MANIFEST=buildsrc/store-app/src/main/AndroidManifest.xml
          EMP_MAIN=buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          EMP_BOOT=buildsrc/employee-app/src/main/java/com/attendpro/employee/PresenceBootReceiver.kt
          EMP_FAST=buildsrc/employee-app/src/main/java/com/attendpro/employee/EmployeeMessageFastPoller142.kt
          STORE_MESSAGES=buildsrc/store-app/src/main/java/com/attendpro/store/StoreMessages1975Activity.kt
          EMP_MESSAGES=buildsrc/employee-app/src/main/java/com/attendpro/employee/EmployeeMessages1975Activity.kt

          # Single Store-side navigation path: Reports -> receiver center.
          grep -q 'هواتف الاستلام' "$REPORTS"
          grep -q 'StoreReceiverPermissionsActivity::class.java' "$REPORTS"
          ! grep -q 'StoreReceiverPermissionsActivity::class.java' "$SETTINGS"
          grep -q 'StoreReceiverPermissionsActivity' "$MANIFEST"

          # V152 preserves the V149 receiver center.
          grep -q 'private enum class Tab { OVERVIEW, PHONES, ADD_PHONE }' "$CENTER"
          grep -q 'نظرة عامة' "$CENTER"
          grep -q 'الهواتف' "$CENTER"
          grep -q 'إضافة هاتف' "$CENTER"
          ! grep -q 'Tab.PERMISSIONS' "$CENTER"
          ! grep -q 'private fun permissionsTab' "$CENTER"
          grep -q 'تعديل صلاحيات هذا الهاتف' "$CENTER"
          grep -q 'deleteReceiverBinding' "$CENTER"
          grep -q 'META_PENDING_DELETES' "$CENTER"
          grep -q '1/5 تم التعرف على QR الهاتف' "$CENTER"
          grep -q 'اكتشاف هاتف قريب' "$CENTER"
          grep -q 'discoverNearbyReceiver' "$CENTER"
          grep -q 'deliverNearbyGrantAsync' "$CENTER"
          grep -q 'pending_receiver_syncs_v140' "$CENTER"
          grep -q 'تم حفظ الهاتف فورًا' "$CENTER"
          test "$(grep -c 'setContentView(' "$CENTER")" -eq 1
          ! grep -q 'buildUi' "$CENTER"

          # Receiver Activity: render/state/network/navigation are separated.
          grep -q 'enum class Section' "$RECEIVER"
          grep -q 'capabilitiesGeneration' "$RECEIVER"
          grep -q 'reportsGeneration' "$RECEIVER"
          grep -q 'messagesGeneration' "$RECEIVER"
          grep -q 'capabilitiesInFlight' "$RECEIVER"
          grep -q 'reportsInFlight' "$RECEIVER"
          grep -q 'messagesInFlight' "$RECEIVER"
          grep -q 'isFinishing' "$RECEIVER"
          grep -q 'isDestroyed' "$RECEIVER"
          test "$(grep -c 'setContentView(' "$RECEIVER")" -eq 1
          ! grep -q 'buildUi' "$RECEIVER"
          ! grep -q 'receiverStoreSettings' "$RECEIVER"
          ! grep -q 'store-settings' "$RECEIVER"

          # V152 preserves V149 multi-store isolation and receiver permissions.
          grep -q 'Section { STORES, STATUS, REPORTS, MESSAGES, ARCHIVE }' "$RECEIVER"
          ! grep -q 'Section.EMPLOYEES' "$RECEIVER"
          ! grep -q 'ReceiverEmployeeAdminClient' "$RECEIVER"
          ! grep -q 'إدارة الموظفين' "$CENTER"
          ! grep -q 'Employee management' "$CENTER"
          grep -q 'savePermissions(phone, reports.isChecked, messages.isChecked)' "$CENTER"
          grep -q 'phone.receiverId, reports, messages, false' "$CENTER"
          grep -q '!remote.canManageStore' "$CENTER"
          grep -q 'canManageStore = false' "$RECEIVER"
          grep -q 'var canManageStore: Boolean get() = false' "$PROTOCOL"
          grep -q 'renderStores' "$RECEIVER"
          grep -q 'refreshStoreBindings' "$RECEIVER"
          grep -q 'queueServerUnlink' "$RECEIVER"
          grep -q 'switchStore' "$RECEIVER"
          grep -q 'actionGeneration' "$RECEIVER"
          grep -q 'receivedReports(storeId)' "$RECEIVER"
          grep -q '/api/v1/monitor/stores' "$CENTRAL"
          grep -q '/api/v1/monitor/stores/unlink' "$CENTRAL"
          grep -q 'data class ReceiverStoreBinding' "$PROTOCOL"
          grep -q 'storeBindingsV138' "$PROTOCOL"
          grep -q 'activeStoreIdV138' "$PROTOCOL"
          grep -q 'storeId: String = ""' "$PROTOCOL"
          test "$(grep -c 'setContentView(' "$RECEIVER")" -eq 1
          ! grep -q 'buildUi' "$RECEIVER"

          # V152 preserves V149 nearby report delivery independent from employee BLE pairing.
          test -f "$OFFLINE_PROTOCOL"
          test -f "$LAN_REPORT"
          test -f "$BLE_REPORT"
          grep -q 'ReceiverOfflineReportProtocol' "$REPORTS"
          grep -q 'ReceiverReportLanClient.send' "$REPORTS"
          grep -q 'ReceiverReportBleClient.send' "$REPORTS"
          test -f "$SERVICE"
          grep -q 'ReceiverReportService.ensureStarted' "$RECEIVER"
          grep -q 'ReceiverReportLanServer' "$SERVICE"
          grep -q 'ReceiverReportBleServer' "$SERVICE"
          grep -q 'pollServerReports' "$SERVICE"
          grep -q 'confirmRemoteReport' "$SERVICE"
          grep -q 'pollServerMessages' "$SERVICE"
          grep -q 'cacheMessageReplies' "$SERVICE"
          grep -q 'receivedMessageReplies' "$RECEIVER"
          grep -q 'receiverMessageRepliesV141' "$PROTOCOL"
          grep -q 'nearbyPairingActive' "$SERVICE"
          grep -q 'acceptNearbyGrant' "$SERVICE"
          grep -q '0000f139-0000-1000-8000-00805f9b34fb' "$BLE_REPORT"
          grep -q 'BLUETOOTH_SCAN' "$MANIFEST"
          grep -q 'BLUETOOTH_CONNECT' "$MANIFEST"
          grep -q 'BLUETOOTH_ADVERTISE' "$MANIFEST"
          grep -q 'DISCOVERY_PORT = 47730' "$LAN_REPORT"
          grep -q 'REPORT_PORT = 47731' "$LAN_REPORT"
          grep -q 'APRL1:' "$OFFLINE_PROTOCOL"
          grep -q 'APACK1' "$OFFLINE_PROTOCOL"
          grep -q 'APGR1:' "$OFFLINE_PROTOCOL"
          grep -q 'nearbyProbe' "$OFFLINE_PROTOCOL"
          grep -q 'nearbyGrantAck' "$OFFLINE_PROTOCOL"
          grep -q 'ReceiverReportService' "$MANIFEST"
          grep -q 'FOREGROUND_SERVICE_CONNECTED_DEVICE' "$MANIFEST"
          grep -q 'foregroundServiceType="connectedDevice"' "$MANIFEST"
          grep -q 'sendNearbyGrant' "$LAN_REPORT"
          grep -q 'sendNearbyGrant' "$BLE_REPORT"
          grep -q 'INVITE_UUID' "$BLE_REPORT"

          # V152 preserves the V149 receiver final lock.
          grep -q 'ACTION_DATA_CHANGED' "$SERVICE"
          grep -q 'ACTION_SYNC_NOW' "$SERVICE"
          grep -q 'REPORT_POLL_MS = 1_500L' "$SERVICE"
          grep -q 'MESSAGE_POLL_MS = 2_500L' "$SERVICE"
          grep -q 'OUTBOX_POLL_MS = 750L' "$SERVICE"
          grep -q 'launchReportPoll' "$SERVICE"
          grep -q 'launchMessagePoll' "$SERVICE"
          grep -q 'launchOutbox' "$SERVICE"
          grep -q 'flushOutgoingMessages' "$SERVICE"
          grep -q 'broadcastChanged(KIND_REPORTS' "$SERVICE"
          grep -q 'broadcastChanged(KIND_MESSAGES' "$SERVICE"
          grep -q 'queueOutgoingMessage' "$RECEIVER"
          grep -q 'requestImmediateSync' "$RECEIVER"
          grep -q 'registerReceiver(dataEventsReceiver' "$RECEIVER"
          grep -q 'receiverOutgoingMessagesV142' "$PROTOCOL"
          grep -q 'retryOutgoingMessage' "$PROTOCOL"
          grep -q 'clientMessageId' "$CENTRAL"
          grep -q 'connectTimeoutMs = 3_500' "$CENTRAL"
          test -f "$EMP_FAST"
          grep -q 'NORMAL_POLL_MS = 2_000L' "$EMP_FAST"
          grep -q 'LIVE_DASHBOARD_POLL_MS = 1_250L' "$SERVICE"
          grep -q 'EMPLOYEE_POLL_MS = 2_000L' "$SERVICE"
          grep -q 'launchLiveDashboardPoll' "$SERVICE"
          grep -q 'pollLiveDashboard' "$SERVICE"
          grep -q 'remoteDashboard(' "$SERVICE"
          ! grep -q 'remoteReport(' "$SERVICE"
          grep -q 'cacheLiveDashboard' "$SERVICE"
          grep -q 'cachedLiveDashboard' "$PROTOCOL"
          grep -q 'receiverLiveDashboardV145' "$PROTOCOL"
          grep -q 'KIND_LIVE_DASHBOARD' "$SERVICE"
          grep -q 'KIND_LIVE_DASHBOARD' "$RECEIVER"
          grep -q 'المراقبة المباشرة' "$RECEIVER"
          grep -q 'الموظفون الحاضرون' "$RECEIVER"
          grep -q 'الأجهزة المتصلة' "$RECEIVER"
          grep -q 'أرشيف التقارير اليدوية' "$RECEIVER"
          grep -q 'Section.ARCHIVE' "$RECEIVER"
          grep -q 'private fun renderArchive()' "$RECEIVER"
          grep -q 'أرشيف التقارير اليدوية' "$RECEIVER"
          grep -q 'العودة للمراقبة المباشرة' "$RECEIVER"
          grep -q 'V${BuildConfig.VERSION_CODE} LIVE' "$RECEIVER"
          grep -q 'remoteDashboardRevision' "$CENTRAL"
          grep -q 'liveDashboardProbeToken' "$PROTOCOL"
          grep -q 'receiverLiveDashboardProbeV146' "$PROTOCOL"
          grep -q 'remoteDashboardRevision' "$SERVICE"
          grep -q 'APLIVE1:' "$MAIN"
          grep -q 'deliverAttendanceEventToReceiversNearby' "$MAIN"
          grep -q 'sendFastEvent' "$MAIN"
          grep -q 'discoveryWindowMs = 1_350L' "$MAIN"
          grep -q 'connectTimeoutMs = 1_800' "$MAIN"
          grep -q 'applyNearbyLiveEvent' "$PROTOCOL"
          grep -q 'receiverLiveEventIdsV146' "$PROTOCOL"
          grep -q 'applyNearbyLiveEvent' "$SERVICE"
          grep -q 'ADVERTISE_MODE_LOW_LATENCY' "$BLE_REPORT"
          grep -q 'ADVERTISE_TX_POWER_HIGH' "$BLE_REPORT"
          grep -q 'fun sendFastEvent' "$BLE_REPORT"
          ! grep -q 'التقارير المستلمة' "$RECEIVER"
          ! grep -q 'Received reports:' "$RECEIVER"
          grep -q 'RemoteDashboardPerson' "$CENTRAL"
          grep -q 'presentCount' "$CENTRAL"
          # V152 preserves the V149 resilient live dashboard fallback.
          grep -q 'nextFullDashboardFallbackAt' "$SERVICE"
          grep -q 'remoteDashboardRevision' "$SERVICE"
          grep -q 'receiver.markLiveTransport(storeId, "SERVER"' "$SERVICE"
          grep -q 'acceptOfflineReport(envelope, "LAN")' "$SERVICE"
          grep -q 'acceptOfflineReport(envelope, "BLE")' "$SERVICE"
          grep -q 'receiverLiveTransportV147' "$PROTOCOL"
          grep -q 'APMIRROR2:' "$PROTOCOL"
          grep -q 'remoteLiveSnapshot' "$SERVICE"
          grep -q 'publishReceiverLiveSnapshot' buildsrc/core/src/main/java/com/attendpro/core/CentralServerClient.kt
          grep -q 'buildReceiverLiveMirror' "$MAIN"
          grep -q 'receiverRequestPresenceProof' "$CENTRAL"
          grep -q 'receiverPresenceProofStatus' "$CENTRAL"
          grep -q 'requestReceiverPresenceProof' "$RECEIVER"
          grep -q 'طلب إثبات الحضور' "$RECEIVER"
          grep -q 'showQuickMessageDialog' "$RECEIVER"
          grep -q 'إرسال كمهمة' "$RECEIVER"
          test -f RECEIVER-FINAL-LOCK-V149.md
          grep -q 'اتصال هاتف الاستلام بالمحل' "$RECEIVER"
          grep -q 'LivePanel { PRESENT, CONNECTED, DAILY, RECENT }' "$RECEIVER"
          grep -q 'الموظفون الحاضرون' "$RECEIVER"
          grep -q 'الأجهزة المتصلة' "$RECEIVER"
          grep -q 'التقرير اليومي' "$RECEIVER"
          grep -q 'آخر حركة' "$RECEIVER"
          grep -q 'اتصال هاتف الاستلام بالمحل:' "$RECEIVER"
          grep -q 'liveTransportLabel' "$RECEIVER"
          grep -q 'if (usedExactMirror) "الخادم • مرآة المحل"' "$RECEIVER"
          grep -q 'if (repo.serverUrl.isBlank() || !repo.isCentralActivationActive()) return' "$MAIN"
          grep -q 'if (!repo.reportAutoSync || syncInProgress' "$MAIN"
          grep -q 'connectedCount' "$CENTRAL"
          grep -q 'receiverEmployeesV143' "$PROTOCOL"
          grep -q 'cacheEmployees' "$SERVICE"
          grep -q 'KIND_EMPLOYEES' "$SERVICE"
          grep -q 'KIND_EMPLOYEES' "$RECEIVER"
          grep -q 'loadCachedEmployees' "$RECEIVER"
          grep -q 'resolvedReceiverName' "$PROTOCOL"
          grep -q 'resolvedReceiverName()' "$RECEIVER"
          grep -q 'triggerImmediateAttendanceSync(event: AttendanceEvent)' "$MAIN"
          grep -q 'syncAttendanceEventImmediate' "$MAIN"
          grep -q 'syncAttendanceEventImmediate' "$CENTRAL"
          grep -q 'connectTimeoutMs = 2_500' "$CENTRAL"
          grep -q 'readTimeoutMs = 3_500' "$CENTRAL"
          ! grep -q 'nearbyRefreshHandler.postDelayed({ autoSyncIfReady() }, 850L)' "$MAIN"
          ! grep -q 'nearbyRefreshHandler.postDelayed({ autoSyncIfReady() }, 1_900L)' "$MAIN"
          grep -q 'Section.REPORTS' "$RECEIVER"
          grep -q 'binding.canReceiveReports -> Section.REPORTS' "$RECEIVER"
          grep -q 'binding.canMessageEmployees -> Section.MESSAGES' "$RECEIVER"
          grep -q 'loadCachedEmployees(binding.storeId)' "$RECEIVER"
          grep -q 'receiver.receivedMessageReplies(binding.storeId)' "$RECEIVER"
          grep -q 'تظهر هنا موظفو هذا المحل فقط' "$RECEIVER"
          grep -q 'فتح تقارير هذا المحل' "$RECEIVER"
          grep -q 'LinkedBlockingQueue' "$CENTER"
          grep -q 'Searching automatically over Wi‑Fi and Bluetooth' "$CENTER"
          grep -q 'ReceiverReportLanClient.discoverNearbyInvite(timeoutMs = 2_200L)' "$CENTER"
          grep -q 'ReceiverReportBleClient.discoverNearbyInvite(this)' "$CENTER"
          grep -q 'enableNearbyPairing(this, 180_000L)' "$RECEIVER"
          grep -q 'اسم الهاتف:' "$CENTER"
          ! grep -q '"المعرف: ${phone.receiverId}' "$CENTER"
          grep -q 'EmployeeMessageFastPoller142.start(this)' "$EMP_MAIN"
          grep -q 'EmployeeMessageFastPoller142.start(context)' "$EMP_BOOT"
          ! git diff --quiet 7c9c8aeb8316da5334096820bf3fe16f45f8a630 -- buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          git diff --exit-code 7c9c8aeb8316da5334096820bf3fe16f45f8a630 -- buildsrc/employee-app/src/main/java/com/attendpro/employee/PresenceService.kt

          # No receiver-side employee management survives in the receiver Activity.
          ! grep -q 'employee_links' "$RECEIVER"

          # Existing Store employee synchronization remains untouched for the main Store app.
          grep -q 'syncReceiverEmployeeSnapshot' "$CENTRAL"
          grep -q 'pullReceiverEmployeeCommands' "$CENTRAL"
          grep -q 'ackReceiverEmployeeCommand' "$CENTRAL"
          grep -q 'syncReceiverEmployeeCommandsIfDue' "$MAIN"
          grep -q 'applyReceiverEmployeeCommand' "$MAIN"
          grep -q 'RECEIVER_EMPLOYEE_SYNC_INTERVAL_MS = 20_000L' "$MAIN"
          test "$(grep -c 'syncReceiverEmployeeCommandsIfDue()' "$MAIN")" -eq 1
          grep -q 'syncReceiverEmployeeCommandsIfDue(force = true)' "$MAIN"
          ! grep -q 'syncRemoteControlIfDue()' "$MAIN"

          # Activation recovery remains the established three-stage path.
          grep -q 'استعادة التفعيل تلقائيًا' "$MAIN"
          grep -q 'startAutomaticActivationRecovery' "$MAIN"
          grep -q 'forceCentralActivationRecovery' "$MAIN"
          grep -q 'restoreCentralActivationSmart' "$MAIN"
          grep -q '1/3 التحقق من التفعيل المحفوظ' "$MAIN"
          grep -q '2/3 فحص طلب التفعيل السابق' "$MAIN"
          grep -q '3/3 التعرف على الجهاز من الخادم' "$MAIN"
          grep -q 'CentralServerClient.validateStore' "$MAIN"
          grep -q 'CentralServerClient.activationStatus' "$MAIN"
          grep -q 'CentralServerClient.recoverActivation' "$MAIN"

          # HTTPS resilient transport: system DNS, IPv4 first, encrypted fallback, TLS hostname retained.
          test -f "$DNS"
          grep -q 'Dns.SYSTEM' "$DNS"
          grep -q 'SecureFallbackDns' "$DNS"
          grep -q 'ipv4First' "$DNS"
          grep -q 'Inet4Address' "$DNS"
          grep -q 'https://cloudflare-dns.com/dns-query' "$DNS"
          grep -q 'https://dns.google/resolve' "$DNS"
          grep -q '104.21.44.99' "$DNS"
          grep -q '172.67.198.135' "$DNS"
          grep -q 'isRetryableNetworkFailure' "$DNS"
          grep -q 'ResilientHttp.execute' "$CENTRAL"
          grep -q 'ResilientHttp.execute' "$ADMIN"
          grep -q 'com.squareup.okhttp3:okhttp:4.12.0' buildsrc/core/build.gradle.kts

          # V155 release identity.
          grep -q 'versionCode = 155' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V155-FINAL-QA-RELEASE-HARDENING"' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 155' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC29-V155-FINAL-QA-RELEASE-HARDENING"' buildsrc/employee-app/build.gradle.kts

          # Preserve V154 final visual ergonomics acceptance markers.
          test -f V154-FINAL-VISUAL-ERGONOMICS.md
          grep -q 'ProfessionalChoice' "$MAIN"
          grep -q 'showProfessionalChoiceDialog' "$MAIN"
          grep -q 'mediumStrips = true' "$MAIN"
          grep -q 'attend-history-v153' "$MAIN"
          grep -q 'lastUiMaintenanceAt' "$MAIN"
          grep -q 'eventsByEmployee' "$MAIN"
          grep -q 'historyLoadGeneration' "$MAIN"
          grep -q 'minimumHeight = UiKit.dp(this@MainActivity, 74)' "$MAIN"
          grep -q 'UiKit.dp(this@MainActivity, 40)' "$MAIN"
          grep -q 'setStroke(UiKit.dp(this@MainActivity, 2), p.accent)' "$MAIN"
          grep -q 'تسجيل حضور' "$MAIN"
          grep -q 'تسجيل انصراف' "$MAIN"
          grep -q 'minimumHeight = UiKit.dp(this@MainActivity, if (classic) 156 else 148)' "$MAIN"
          grep -q 'اختصارات إضافية' "$MAIN"
          ! grep -q 'addStoreTabs1978(root)' "$MAIN"
          grep -q 'renderMessages(root, local' "$STORE_MESSAGES"
          grep -q 'جاري تحديث الرسائل في الخلفية' "$STORE_MESSAGES"
          grep -q 'renderEmployeeMessages' "$EMP_MESSAGES"
          grep -q 'Refreshing messages in the background' "$EMP_MESSAGES"
          grep -q 'EmployeeUiChoice' "$EMP_MAIN"
          grep -q 'showEmployeeChoiceDialog' "$EMP_MAIN"

          # V149 Receiver Final Lock must remain byte-identical in V152.
          git diff --exit-code bf20500742cbfa71ad10958bb536a94ee9f41956 -- \
            buildsrc/store-app/src/main/java/com/attendpro/store/ReportReceiverActivity.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/ReceiverReportService.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/ReceiverReportLanTransport.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/ReceiverReportBleTransport.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/StoreReceiverPermissionsActivity.kt \
            buildsrc/core/src/main/java/com/attendpro/core/ReportProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/ReceiverOfflineReportProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/ReceiverEmployeeAdminClient.kt \
            buildsrc/core/src/main/java/com/attendpro/core/CentralServerClient.kt

          # RC29 field-proven pairing/direct-link files remain immutable in V152.
          git diff --exit-code 7c9c8aeb8316da5334096820bf3fe16f45f8a630 -- \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt \
            buildsrc/core/src/main/java/com/attendpro/core/BleDirectProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/BleProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/PairingAckProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/PairingProtocol.kt \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/BlePresenceAdvertiser.kt \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/BleDirectLinkServer.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/BleEmployeeScanner.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/BleDirectLinkClient.kt \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/PresenceService.kt

          # V155 release-hardening guards: preserve the effective RC29 runtime build path.
          git diff --exit-code 7c9c8aeb8316da5334096820bf3fe16f45f8a630 -- buildsrc/build.gradle.kts
          grep -q 'compileSdk = 36' buildsrc/store-app/build.gradle.kts
          grep -q 'targetSdk = 36' buildsrc/store-app/build.gradle.kts
          grep -q 'compileSdk = 36' buildsrc/employee-app/build.gradle.kts
          grep -q 'targetSdk = 36' buildsrc/employee-app/build.gradle.kts
          grep -q 'usesCleartextTraffic="false"' buildsrc/store-app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' buildsrc/employee-app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_CONNECTED_DEVICE' buildsrc/store-app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="connectedDevice"' buildsrc/store-app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_LOCATION' buildsrc/employee-app/src/main/AndroidManifest.xml
          grep -q 'foregroundServiceType="connectedDevice|location"' buildsrc/employee-app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_BACKGROUND_LOCATION' buildsrc/employee-app/src/main/AndroidManifest.xml
          grep -q 'REQUEST_INSTALL_PACKAGES' buildsrc/store-app/src/play/AndroidManifest.xml
          grep -q 'tools:node="remove"' buildsrc/store-app/src/play/AndroidManifest.xml
          grep -q 'REQUEST_INSTALL_PACKAGES' buildsrc/employee-app/src/play/AndroidManifest.xml
          grep -q 'tools:node="remove"' buildsrc/employee-app/src/play/AndroidManifest.xml
          grep -q 'isMonitoringTool' buildsrc/employee-app/src/play/AndroidManifest.xml
          grep -q 'enterprise_management' buildsrc/employee-app/src/play/AndroidManifest.xml
          grep -q 'يجمع ATTEND PRO بيانات الموقع' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'ACCESS_BACKGROUND_LOCATION' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'supportsDirectInstall' buildsrc/core/src/main/java/com/attendpro/core/AppUpdateManager.kt
          grep -q 'verifyPackageAndSigner' buildsrc/core/src/main/java/com/attendpro/core/AppUpdateManager.kt
          grep -q 'MessageDigest' buildsrc/core/src/main/java/com/attendpro/core/AppUpdateManager.kt
          test -f RELEASE-NOTES-V155.md
          test -f V155-FINAL-QA-RELEASE-HARDENING.md
      - name: Verify secure DNS bootstrap
        run: |
          set -euo pipefail
          HOST='attend-pro-central.nmg200101.workers.dev'
          OUT=$(curl -fsS --connect-timeout 8 --max-time 12 -H 'accept: application/dns-json' "https://1.1.1.1/dns-query?name=$HOST&type=A")
          printf '%s' "$OUT" | grep -q '"data":"104.21.44.99"'
          printf '%s' "$OUT" | grep -q '"data":"172.67.198.135"'
          CODE=$(curl -sS --connect-timeout 8 --max-time 12 --resolve "$HOST:443:104.21.44.99" -o /dev/null -w '%{http_code}' "https://$HOST/" || true)
          if [ "$CODE" = "000" ] || [ -z "$CODE" ]; then
            CODE=$(curl -sS --connect-timeout 8 --max-time 12 --resolve "$HOST:443:172.67.198.135" -o /dev/null -w '%{http_code}' "https://$HOST/" || true)
          fi
          test -n "$CODE"
          test "$CODE" != "000"

      - name: Unit test, lint and build Direct + Play
        run: |
          gradle -p buildsrc \
            :core:testDebugUnitTest \
            :foundation:testDebugUnitTest \
            :store-app:testDirectDebugUnitTest \
            :employee-app:testDirectDebugUnitTest \
            :store-app:lintDirectRelease \
            :employee-app:lintDirectRelease \
            :store-app:lintPlayRelease \
            :employee-app:lintPlayRelease \
            :store-app:assembleDirectRelease \
            :employee-app:assembleDirectRelease \
            :store-app:bundlePlayRelease \
            :employee-app:bundlePlayRelease \
            --stacktrace
      - name: Sign V155 APKs and Play AABs
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir signed
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode >/tmp/a.jks
          EXPECTED=2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59

          for APP in employee store; do
            if [ "$APP" = employee ]; then
              MOD=employee-app
              PKG=com.attendpro.employee
              APK_OUT=ATTEND-PRO-Employee-V155.apk
              AAB_OUT=ATTEND-PRO-Employee-V155-PLAY.aab
            else
              MOD=store-app
              PKG=com.attendpro.store
              APK_OUT=ATTEND-PRO-Store-V155.apk
              AAB_OUT=ATTEND-PRO-Store-V155-PLAY.aab
            fi

            U=$(find buildsrc/$MOD/build/outputs/apk/direct/release -name '*-unsigned.apk' -print -quit)
            test -n "$U"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$U" /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks /tmp/a.jks \
              --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" \
              --ks-pass env:ATTEND_PRO_STORE_PASSWORD \
              --key-pass env:ATTEND_PRO_KEY_PASSWORD \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out signed/$APK_OUT /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs signed/$APK_OUT
            CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs signed/$APK_OUT | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
            test "$CERT" = "$EXPECTED"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging signed/$APK_OUT | grep -q "package: name='$PKG' versionCode='155' versionName='2.0.0-RC29-V155-FINAL-QA-RELEASE-HARDENING'"

            BUNDLE=$(find buildsrc/$MOD/build/outputs/bundle/playRelease -name '*.aab' -print -quit)
            test -n "$BUNDLE"
            jarsigner \
              -keystore /tmp/a.jks \
              -storepass:env ATTEND_PRO_STORE_PASSWORD \
              -keypass:env ATTEND_PRO_KEY_PASSWORD \
              -signedjar signed/$AAB_OUT \
              "$BUNDLE" "$ATTEND_PRO_KEY_ALIAS"
            jarsigner -verify signed/$AAB_OUT | grep -q 'jar verified'
          done

          cp RELEASE-NOTES-V155.md signed/RELEASE-NOTES-V155.md
          cp V155-FINAL-QA-RELEASE-HARDENING.md signed/V155-FINAL-QA-RELEASE-HARDENING.md
          git archive --format=zip --output signed/ATTEND-PRO-V155-SOURCE.zip HEAD

          cat > signed/V155-AUTOMATED-QA.txt <<EOF
          ATTEND-PRO V155 — AUTOMATED QA
          Commit: $GITHUB_SHA
          Branch: $GITHUB_REF_NAME
          Version code: 155
          Version name: 2.0.0-RC29-V155-FINAL-QA-RELEASE-HARDENING
          Target/compile SDK: 36
          RC29 protected connection sources: LOCKED
          V149 Receiver sources: LOCKED
          Unit tests: PASSED before this file was generated
          Android lint (Direct + Play): PASSED before this file was generated
          Direct APK build/signature/package verification: PASSED
          Play AAB build/signature verification: PASSED
          FIELD DEVICE GATE: NOT CERTIFIED BY CI. Bluetooth/QR/LAN/GPS/biometric/background/update-install/restore require the real-device smoke matrix before FINAL-RELEASE-LOCK is issued.
          EOF

          (cd signed && sha256sum *.apk *.aab *.zip RELEASE-NOTES-V155.md V155-FINAL-QA-RELEASE-HARDENING.md V155-AUTOMATED-QA.txt > ALL-SHA256SUMS.txt)
          echo "===== V155 SHA-256 ====="
          cat signed/ALL-SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-V155-FINAL-QA-RELEASE-HARDENING-SIGNED
          path: signed/
          retention-days: 90
