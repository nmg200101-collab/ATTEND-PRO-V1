name: Build ATTEND-PRO 1.9.62 Smart Attendance Control

on:
  push:
    branches: [main]
    paths:
      - '.source_patches/1.9.62/**'
      - '.github/workflows/build-installable-1.9.62.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct verified 1.9.61 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf base_art buildsrc
          mkdir -p base_art buildsrc
          gh run download 34070272487 -R "${{ github.repository }}" -n ATTEND-PRO-1.9.61-VERIFICATION-SOURCE -D base_art
          SRC=$(find base_art -name 'ATTEND-PRO-V1-source-1.9.61-MANAGER-HUB-SHORTCUTS.zip' -print -quit)
          test -n "$SRC"
          unzip -q "$SRC" -d buildsrc
          test -f buildsrc/settings.gradle.kts

      - name: Apply and verify 1.9.62 patch
        run: |
          set -euo pipefail
          tr -d '\r\n' < .source_patches/1.9.62/smart-attendance-control.patch.xz.b64 > /tmp/1962.b64
          echo '6982aad9d3f3c79d0180aa6d606118b2e22127be7564d34c3b477d3fa5f047f4  /tmp/1962.b64' | sha256sum -c -
          base64 -d /tmp/1962.b64 | xz -dc > /tmp/1962.patch
          echo '77077f02716e2dca8959b5ca7a926a3f29fef2e88b325c688de87be04cc34c95  /tmp/1962.patch' | sha256sum -c -
          (cd buildsrc && patch -p1 --batch < /tmp/1962.patch)

      - name: Enforce approved 1.9.58 connection engine lock
        run: |
          set -euo pipefail
          cd buildsrc
          sha256sum -c CONNECTION_CORE_LOCK_1.9.58.sha256

      - name: Static 1.9.62 smart attendance audit
        run: |
          set -euo pipefail
          grep -q 'versionCode = 69' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "1.9.62"' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionCode = 69' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "1.9.62"' buildsrc/store-app/build.gradle.kts
          grep -q 'الدوام والتنبيهات الذكية' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'GPS للرصد فقط وليس إثبات حضور' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'employeeWorkDays' buildsrc/core/src/main/java/com/attendpro/core/LocalStores.kt
          grep -q 'smartAlertAudience' buildsrc/core/src/main/java/com/attendpro/core/LocalStores.kt
          grep -q 'checkoutReminderEnabled' buildsrc/core/src/main/java/com/attendpro/core/LocalStores.kt
          grep -q 'tickCheckoutReminders' buildsrc/store-app/src/main/java/com/attendpro/store/SmartLateAlertManager.kt

      - name: Core tests and Kotlin compile
        run: gradle -p buildsrc :core:testDebugUnitTest :employee-app:compileDebugKotlin :store-app:compileDebugKotlin --stacktrace

      - name: Build debug and unsigned release APKs
        run: gradle -p buildsrc :employee-app:assembleDebug :store-app:assembleDebug :employee-app:assembleRelease :store-app:assembleRelease --stacktrace

      - name: Verify packages and version
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          EMP=buildsrc/employee-app/build/outputs/apk/debug/employee-app-debug.apk
          STO=buildsrc/store-app/build/outputs/apk/debug/store-app-debug.apk
          "$AAPT" dump badging "$EMP" | tee employee-badging.txt
          "$AAPT" dump badging "$STO" | tee store-badging.txt
          grep -q "package: name='com.attendpro.employee' versionCode='69' versionName='1.9.62'" employee-badging.txt
          grep -q "package: name='com.attendpro.store' versionCode='69' versionName='1.9.62'" store-badging.txt

      - name: Attempt approved permanent signing
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signed
          EXPECTED='6f8bcc08ae6c8d9654e7aa2c9a661fb6bdf21e31b720ab3add88aed0cd4f4d82'
          for V in ATTEND_PRO_KEYSTORE_B64 ATTEND_PRO_STORE_PASSWORD ATTEND_PRO_KEY_ALIAS ATTEND_PRO_KEY_PASSWORD; do
            if [ -z "${!V:-}" ]; then
              echo 'PERMANENT_SIGNING_AVAILABLE=false' | tee signing-status.txt
              exit 0
            fi
          done
          KEYSTORE=/tmp/attend-pro-permanent.jks
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for APP in employee store; do
            if [ "$APP" = employee ]; then MOD=employee-app; OUT=ATTEND-PRO-Employee-1.9.62-PERMANENT.apk; else MOD=store-app; OUT=ATTEND-PRO-Store-1.9.62-PERMANENT.apk; fi
            UNS=buildsrc/$MOD/build/outputs/apk/release/$MOD-release-unsigned.apk
            "$ZIPALIGN" -f -p 4 "$UNS" /tmp/$APP-aligned.apk
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" --ks-pass "env:ATTEND_PRO_STORE_PASSWORD" --key-pass "env:ATTEND_PRO_KEY_PASSWORD" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out "signed/$OUT" /tmp/$APP-aligned.apk
            ACTUAL=$("$APKSIGNER" verify --print-certs "signed/$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr 'A-F' 'a-f')
            [ "$ACTUAL" = "$EXPECTED" ] || exit 1
          done
          echo 'PERMANENT_SIGNING_AVAILABLE=true' | tee signing-status.txt
          sha256sum signed/*.apk | tee signed/SHA256SUMS.txt

      - name: Package verified source
        run: |
          set -euo pipefail
          (cd buildsrc && zip -qr ../ATTEND-PRO-V1-source-1.9.62-SMART-ATTENDANCE-CONTROL.zip . -x '.gradle/*' 'core/build/*' 'employee-app/build/*' 'store-app/build/*')
          cp /tmp/1962.patch ATTEND-PRO-1.9.62-SMART-ATTENDANCE.patch
          sha256sum ATTEND-PRO-V1-source-1.9.62-SMART-ATTENDANCE-CONTROL.zip > source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Employee-1.9.62-DEBUG-TEST
          path: buildsrc/employee-app/build/outputs/apk/debug/employee-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Store-1.9.62-DEBUG-TEST
          path: buildsrc/store-app/build/outputs/apk/debug/store-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.62-UNSIGNED-RELEASE
          path: |
            buildsrc/employee-app/build/outputs/apk/release/employee-app-release-unsigned.apk
            buildsrc/store-app/build/outputs/apk/release/store-app-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.62-SIGNED-IF-AVAILABLE
          if-no-files-found: ignore
          path: signed/*
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.62-VERIFICATION-SOURCE
          path: |
            ATTEND-PRO-V1-source-1.9.62-SMART-ATTENDANCE-CONTROL.zip
            ATTEND-PRO-1.9.62-SMART-ATTENDANCE.patch
            signing-status.txt
            employee-badging.txt
            store-badging.txt
            source-sha256.txt
