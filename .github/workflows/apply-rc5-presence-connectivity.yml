name: Apply RC5 Presence Connectivity

on:
  push:
    branches: [attend-pro-v2.0.0-rc2-play-compliance]
    paths:
      - '.github/workflows/apply-rc5-presence-connectivity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Apply and verify RC5
        run: |
          set -euo pipefail
          python3 tools/apply-rc5-presence-connectivity.py
          sha256sum -c CONNECTION_CORE_LOCK_V2_FOUNDATION.sha256
          python3 tools/guard-1.9.77-core-pairing.py snapshot
          python3 tools/guard-1.9.77-core-pairing.py verify
          git diff --exit-code 3b479e310d06bdaec96205aae8787fb264fa02c9 -- \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt \
            buildsrc/core/src/main/java/com/attendpro/core/BleDirectProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/BleProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/PairingAckProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/PairingProtocol.kt
          gradle -p buildsrc :core:testDebugUnitTest :store-app:testDirectDebugUnitTest :store-app:compileDirectDebugKotlin :employee-app:compileDirectDebugKotlin --stacktrace
          git diff --check
      - name: Commit RC5 application changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add buildsrc RELEASE_NOTES_V2.0.0_RC5.md FIELD_TEST_CHECKLIST_RC5.md
          git commit -m 'RC5: restore Bluetooth GPS status and add proof scheduling'
          git push origin HEAD:attend-pro-v2.0.0-rc2-play-compliance
