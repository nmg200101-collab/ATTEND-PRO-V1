name: Build ATTEND-PRO 1.9.76 SIMPLIFIED NAVIGATION
on:
  push:
    branches: [attend-pro-1.9.76-simplified-navigation]
    paths:
      - '.github/workflows/build-installable-1.9.76-simplified-navigation.yml'
      - 'tools/patch-1.9.76-simplified-navigation.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Prepare stable 1.9.70 source as 1.9.76
        run: |
          rm -rf buildsrc signed
          mkdir buildsrc signed
          unzip -q ATTEND-PRO-1.9.66-FINAL-SOURCE-FIXED.zip -d buildsrc
          sed -i 's/versionCode = 73/versionCode = 83/g; s/versionName = "1.9.66"/versionName = "1.9.76"/g' buildsrc/employee-app/build.gradle.kts buildsrc/store-app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          old='pairingDiscovery.start(envelope.code, PairingDiscovery.Mode.ALL)'
          new='pairingDiscovery.stop()\n        acceptProvision(envelope.provisionText, localChannel = "QR AP5Q")'
          if old in s:
              s=s.replace(old,new,1)
          elif 'acceptProvision(envelope.provisionText' not in s:
              raise SystemExit('stable 1.9.70 AP5Q baseline missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Rebuild exact 1.9.75 baseline first
        run: |
          python3 tools/patch-1.9.71-system-management.py
          python3 tools/fix-1.9.71-self-registration-kotlin.py
          python3 tools/patch-1.9.72-management-ui.py
          python3 tools/patch-1.9.73-management-final.py
          python3 tools/patch-1.9.74-final-polish.py
          python3 tools/fix-1.9.74-missing-helpers.py
          python3 tools/patch-1.9.75-store-management.py
          python3 tools/fix-1.9.75-store-message-receiver.py
      - name: Snapshot pairing and transport implementation from 1.9.75
        run: |
          set -euo pipefail
          sha256sum \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/BleDirectLinkServer.kt \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/PresenceService.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/BleDirectLinkClient.kt \
            buildsrc/core/src/main/java/com/attendpro/core/CentralServerClient.kt > /tmp/protected-files.sha256
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, json
          targets = {
              'buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt': [
                  'scanProvision','showManualProvision','showPairingCenter','acceptProvision','startPresence','startBackgroundPresence'
              ],
              'buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt': [
                  'directBleConfig','handleBlePayload','handleLanConfirm','isLanConnected','isAuthenticatedPresenceConnected',
                  'isEmployeeActuallyConnected','testEmployeePhoneLink','showProvisionQr','showConnectionCenter'
              ]
          }
          def extract(path, name):
              s=Path(path).read_text(encoding='utf-8')
              m=re.search(r'\\bfun\\s+'+re.escape(name)+r'\\s*\\(',s)
              if not m: raise SystemExit(f'missing protected function {name} in {path}')
              start=s.rfind('\\n',0,m.start())+1
              brace=s.find('{',m.end())
              depth=0; in_str=False; esc=False
              for i in range(brace,len(s)):
                  c=s[i]
                  if in_str:
                      if esc: esc=False
                      elif c=='\\\\': esc=True
                      elif c=='"': in_str=False
                      continue
                  if c=='"': in_str=True; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: return s[start:i+1]
              raise SystemExit(f'unbalanced protected function {name}')
          out={}
          for path,names in targets.items():
              out[path]={name:hashlib.sha256(extract(path,name).encode()).hexdigest() for name in names}
          Path('/tmp/protected-functions.json').write_text(json.dumps(out,sort_keys=True),encoding='utf-8')
          PY
      - name: Apply 1.9.76 simplified navigation only
        run: python3 tools/patch-1.9.76-simplified-navigation.py
      - name: Verify pairing unchanged and simplified UI present
        run: |
          set -euo pipefail
          sha256sum -c /tmp/protected-files.sha256
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, json
          expected=json.loads(Path('/tmp/protected-functions.json').read_text(encoding='utf-8'))
          def extract(path, name):
              s=Path(path).read_text(encoding='utf-8')
              m=re.search(r'\\bfun\\s+'+re.escape(name)+r'\\s*\\(',s)
              if not m: raise SystemExit(f'missing protected function {name} in {path}')
              start=s.rfind('\\n',0,m.start())+1
              brace=s.find('{',m.end())
              depth=0; in_str=False; esc=False
              for i in range(brace,len(s)):
                  c=s[i]
                  if in_str:
                      if esc: esc=False
                      elif c=='\\\\': esc=True
                      elif c=='"': in_str=False
                      continue
                  if c=='"': in_str=True; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: return s[start:i+1]
              raise SystemExit(f'unbalanced protected function {name}')
          for path, funcs in expected.items():
              for name, digest in funcs.items():
                  actual=hashlib.sha256(extract(path,name).encode()).hexdigest()
                  if actual != digest: raise SystemExit(f'PAIRING FUNCTION CHANGED: {path}:{name}')
          print('Protected pairing/transport functions unchanged')
          PY
          grep -q 'stopBleScanForGatt()' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'requestMtu(247)' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'MAX_GATT_CHUNK_SIZE = 360' buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'addServiceUuid(BleProtocol.SERVICE_UUID)' buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'acceptProvision(envelope.provisionText' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'showStoreTopMenu1976' buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          grep -q 'الإعدادات المتقدمة' buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          grep -q 'showStoreMainMenu1976' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'showEmployeeEditorAdvanced' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'إدارة الموظفين' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'showEmployeeMainMenu1976' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'دليل مستخدم الموظف' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'الإشعارات ودليل المستخدم والإعدادات موجودة في قائمة' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
      - name: Build and regression test
        run: |
          gradle -p buildsrc :core:testDebugUnitTest :employee-app:compileDebugKotlin :store-app:compileDebugKotlin :employee-app:assembleDebug :store-app:assembleDebug :employee-app:assembleRelease :store-app:assembleRelease --stacktrace
      - name: Sign official release with existing certificate
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXPECTED=2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59
          KEYSTORE=/tmp/attend-pro.jks
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          for APP in employee store; do
            if [ "$APP" = employee ]; then
              MOD=employee-app
              OUT=ATTEND-PRO-Employee-1.9.76-FINAL.apk
            else
              MOD=store-app
              OUT=ATTEND-PRO-Store-1.9.76-FINAL.apk
            fi
            UNS=buildsrc/$MOD/build/outputs/apk/release/$MOD-release-unsigned.apk
            test -f "$UNS"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNS" /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" \
              --ks-pass "env:ATTEND_PRO_STORE_PASSWORD" \
              --key-pass "env:ATTEND_PRO_KEY_PASSWORD" \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out signed/$OUT /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs signed/$OUT
            ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs signed/$OUT | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
            test "$ACTUAL" = "$EXPECTED"
          done
          sha256sum signed/*.apk > signed/SHA256SUMS.txt
          printf 'ATTEND-PRO 1.9.76\nBase: signed 1.9.75\nSimplified Store management and Employee home navigation\nTop menu: notifications + user guide + settings\nProtected BLE/QR/GATT pairing functions verified unchanged\nCertificate SHA-256: %s\n' "$EXPECTED" > signed/RELEASE-INFO.txt
      - name: Package final patched source
        run: |
          (cd buildsrc && zip -qr ../signed/ATTEND-PRO-1.9.76-FINAL-SOURCE.zip . -x '*/build/*' '.gradle/*')
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.76-FINAL-SIGNED
          path: signed/*
