name: Build ATTEND-PRO 1.9.60 Calm UI + Recovery

on:
  push:
    branches: [main]
    paths:
      - '.source_patches/1.9.60/**'
      - '.github/workflows/build-installable-1.9.60.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct verified 1.9.59 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf base_art buildsrc
          mkdir -p base_art buildsrc
          gh run download 34065524858 -R "${{ github.repository }}" -n ATTEND-PRO-1.9.59-VERIFICATION-SOURCE -D base_art
          SRC=$(find base_art -name 'ATTEND-PRO-V1-source-1.9.59-STORE-DASHBOARD-CONNECTION-LOCK.zip' -print -quit)
          test -n "$SRC"
          unzip -q "$SRC" -d buildsrc
          test -f buildsrc/settings.gradle.kts

      - name: Reconstruct and verify 1.9.60 patch
        run: |
          set -euo pipefail
          tr -d '\r\n' < .source_patches/1.9.60/calm-ui-owner-recovery.patch.xz.b64 > /tmp/1960.b64
          echo '5340c1ceb7ea6bfd805049115f3f6353e512968055348cd36c81eb6574cf1f71  /tmp/1960.b64' | sha256sum -c -
          base64 -d /tmp/1960.b64 | xz -dc > /tmp/1960.patch
          echo 'e23597a50bad28212d15b9dba12be6a532b884ea5c3df06bff2339e849d8d73d  /tmp/1960.patch' | sha256sum -c -
          (cd buildsrc && patch -p1 --batch < /tmp/1960.patch)

      - name: Enforce approved 1.9.58 connection engine lock
        run: |
          set -euo pipefail
          cd buildsrc
          sha256sum -c CONNECTION_CORE_LOCK_1.9.58.sha256

      - name: Static 1.9.60 UX and recovery audit
        run: |
          set -euo pipefail
          grep -q 'versionCode = 67' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "1.9.60"' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionCode = 67' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "1.9.60"' buildsrc/store-app/build.gradle.kts
          grep -q 'الموظفون الحاضرون' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'الأجهزة المتصلة' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'تسجيل حضور' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'تسجيل انصراف' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'إدارة صاحب المحل / المدير' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'استعادة بتصريح صاحب النظام' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q '/api/v1/activation/recover-approved' buildsrc/core/src/main/java/com/attendpro/core/CentralServerClient.kt
          grep -q '/api/v1/admin/stores/recovery-grant' buildsrc/core/src/main/java/com/attendpro/core/CentralServerClient.kt
          grep -q '/api/v1/admin/stores/archive' buildsrc/core/src/main/java/com/attendpro/core/CentralServerClient.kt

      - name: Core tests and Kotlin compile
        run: gradle -p buildsrc :core:testDebugUnitTest :employee-app:compileDebugKotlin :store-app:compileDebugKotlin --stacktrace

      - name: Build debug and unsigned release APKs
        run: gradle -p buildsrc :employee-app:assembleDebug :store-app:assembleDebug :employee-app:assembleRelease :store-app:assembleRelease --stacktrace

      - name: Verify packages and version
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          EMP=buildsrc/employee-app/build/outputs/apk/debug/employee-app-debug.apk
          STO=buildsrc/store-app/build/outputs/apk/debug/store-app-debug.apk
          "$AAPT" dump badging "$EMP" | tee employee-badging.txt
          "$AAPT" dump badging "$STO" | tee store-badging.txt
          grep -q "package: name='com.attendpro.employee' versionCode='67' versionName='1.9.60'" employee-badging.txt
          grep -q "package: name='com.attendpro.store' versionCode='67' versionName='1.9.60'" store-badging.txt

      - name: Attempt approved permanent signing
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signed
          EXPECTED='6f8bcc08ae6c8d9654e7aa2c9a661fb6bdf21e31b720ab3add88aed0cd4f4d82'
          for V in ATTEND_PRO_KEYSTORE_B64 ATTEND_PRO_STORE_PASSWORD ATTEND_PRO_KEY_ALIAS ATTEND_PRO_KEY_PASSWORD; do
            if [ -z "${!V:-}" ]; then
              echo 'PERMANENT_SIGNING_AVAILABLE=false' | tee signing-status.txt
              exit 0
            fi
          done
          KEYSTORE=/tmp/attend-pro-permanent.jks
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for APP in employee store; do
            if [ "$APP" = employee ]; then MOD=employee-app; OUT=ATTEND-PRO-Employee-1.9.60-PERMANENT.apk; else MOD=store-app; OUT=ATTEND-PRO-Store-1.9.60-PERMANENT.apk; fi
            UNS=buildsrc/$MOD/build/outputs/apk/release/$MOD-release-unsigned.apk
            "$ZIPALIGN" -f -p 4 "$UNS" /tmp/$APP-aligned.apk
            "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" --ks-pass "env:ATTEND_PRO_STORE_PASSWORD" --key-pass "env:ATTEND_PRO_KEY_PASSWORD" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out "signed/$OUT" /tmp/$APP-aligned.apk
            ACTUAL=$("$APKSIGNER" verify --print-certs "signed/$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr 'A-F' 'a-f')
            [ "$ACTUAL" = "$EXPECTED" ] || exit 1
          done
          echo 'PERMANENT_SIGNING_AVAILABLE=true' | tee signing-status.txt
          sha256sum signed/*.apk | tee signed/SHA256SUMS.txt

      - name: Package verified source
        run: |
          set -euo pipefail
          (cd buildsrc && zip -qr ../ATTEND-PRO-V1-source-1.9.60-CALM-UI-RECOVERY.zip . -x '.gradle/*' 'core/build/*' 'employee-app/build/*' 'store-app/build/*')
          cp /tmp/1960.patch ATTEND-PRO-1.9.60-CALM-UI-RECOVERY.patch
          sha256sum ATTEND-PRO-V1-source-1.9.60-CALM-UI-RECOVERY.zip > source-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Employee-1.9.60-DEBUG-TEST
          path: buildsrc/employee-app/build/outputs/apk/debug/employee-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Store-1.9.60-DEBUG-TEST
          path: buildsrc/store-app/build/outputs/apk/debug/store-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.60-SIGNED-IF-AVAILABLE
          if-no-files-found: ignore
          path: signed/*
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.60-VERIFICATION-SOURCE
          path: |
            ATTEND-PRO-V1-source-1.9.60-CALM-UI-RECOVERY.zip
            ATTEND-PRO-1.9.60-CALM-UI-RECOVERY.patch
            signing-status.txt
            employee-badging.txt
            store-badging.txt
            source-sha256.txt
