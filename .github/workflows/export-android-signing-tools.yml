name: Export Android APK Signing Tools

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/export-android-signing-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0"
      - name: Package signing utilities
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p export/lib
          cp "$BT/apksigner" export/
          cp "$BT/lib/apksigner.jar" export/lib/
          cp "$BT/zipalign" export/
          chmod +x export/apksigner export/zipalign
          sha256sum export/apksigner export/lib/apksigner.jar export/zipalign > export/SHA256SUMS.txt
          "$BT/apksigner" --version > export/APKSIGNER-VERSION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ANDROID-APK-SIGNING-TOOLS-35
          path: export/
