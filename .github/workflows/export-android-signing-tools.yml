name: Export Android Signing Tools

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install build tools 35.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "build-tools;35.0.0"
      - name: Stage signing tools
        run: |
          mkdir -p exported-signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" exported-signing-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" exported-signing-tools/zipalign
          chmod +x exported-signing-tools/zipalign
          sha256sum exported-signing-tools/* > exported-signing-tools/SHA256SUMS.txt
      - name: Upload signing tools
        uses: actions/upload-artifact@v4
        with:
          name: android-signing-tools-35.0.0
          path: exported-signing-tools/
