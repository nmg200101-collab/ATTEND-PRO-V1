name: Build ATTEND-PRO 1.9.56 Pairing Discovery Fix

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-installable-1.9.56.yml'
      - '.source_patches/1.9.56/**'

permissions:
  contents: write
  actions: read

jobs:
  build-installable:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct verified 1.9.56 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifact buildsrc final
          mkdir -p artifact buildsrc final
          gh release download v1.9.55-real-link-3 -R "${{ github.repository }}" -p 'ATTEND-PRO-V1-source-1.9.55-REAL-LINK.zip' -D artifact
          unzip -q artifact/ATTEND-PRO-V1-source-1.9.55-REAL-LINK.zip -d buildsrc
          base64 -d .source_patches/1.9.56/discovery-filter-fix.patch.xz.b64 | xz -dc > /tmp/1956.patch
          echo 'a77b9f7da3b8c04873bb90de517e58cf76f9af2f66a24da9c369f8b68b4c2c72  /tmp/1956.patch' | sha256sum -c -
          (cd buildsrc && patch -p1 --batch < /tmp/1956.patch)
          grep -q 'versionCode = 63' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "1.9.56"' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionCode = 63' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "1.9.56"' buildsrc/store-app/build.gradle.kts

      - name: Static pairing discovery audit
        run: |
          set -euo pipefail
          EMP=buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          STORE=buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'setServiceData(BleProtocol.SERVICE_UUID, pairingPrefix, pairingMask)' "$EMP"
          grep -q 'setManufacturerData' "$EMP"
          grep -q 'addServiceUuid(BleProtocol.SERVICE_UUID)' "$STORE"
          grep -q 'addServiceData(BleProtocol.SERVICE_UUID, currentBleMessage)' "$STORE"
          ! grep -q 'ScanFilter.Builder().setServiceUuid(BleProtocol.SERVICE_UUID).build()' "$EMP"

      - name: Run connection protocol tests
        run: gradle -p buildsrc :core:testDebugUnitTest --stacktrace

      - name: Build installable APKs
        run: gradle -p buildsrc :employee-app:assembleDebug :store-app:assembleDebug --stacktrace

      - name: Verify packages and signatures
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          EMP="buildsrc/employee-app/build/outputs/apk/debug/employee-app-debug.apk"
          STORE="buildsrc/store-app/build/outputs/apk/debug/store-app-debug.apk"
          test -s "$EMP" && test -s "$STORE"
          "$AAPT" dump badging "$EMP" | grep -q "versionCode='63' versionName='1.9.56'"
          "$AAPT" dump badging "$STORE" | grep -q "versionCode='63' versionName='1.9.56'"
          "$APKSIGNER" verify --verbose --print-certs "$EMP" | tee employee-signing.txt
          "$APKSIGNER" verify --verbose --print-certs "$STORE" | tee store-signing.txt
          cp "$EMP" final/ATTEND-PRO-Employee-1.9.56-DISCOVERY-FIX-TEST.apk
          cp "$STORE" final/ATTEND-PRO-Store-1.9.56-DISCOVERY-FIX-TEST.apk
          sha256sum final/*.apk | tee final/SHA256SUMS.txt
          cp employee-signing.txt store-signing.txt final/
          printf '%s\n' \
            'ATTEND-PRO 1.9.56 pairing discovery field-test build.' \
            'Fixes employee-side BLE filtering: the Store pairing beacon is matched as service data P########, with manufacturer fallback.' \
            'Store pairing advertising now also carries an explicit service UUID plus service data for OEM compatibility.' \
            'Debug-signed because permanent production signing secrets are unavailable.' > final/INSTALL-NOTE.txt

      - name: Package source
        run: (cd buildsrc && zip -qr ../final/ATTEND-PRO-V1-source-1.9.56-DISCOVERY-FIX.zip .)

      - name: Upload Employee APK
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Employee-1.9.56-DISCOVERY-FIX-TEST
          path: final/ATTEND-PRO-Employee-1.9.56-DISCOVERY-FIX-TEST.apk

      - name: Upload Store APK
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Store-1.9.56-DISCOVERY-FIX-TEST
          path: final/ATTEND-PRO-Store-1.9.56-DISCOVERY-FIX-TEST.apk

      - name: Upload source and verification
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.56-DISCOVERY-FIX-VERIFICATION
          path: final/

      - name: Publish field-test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.9.56-discovery-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" final/* --repo "${{ github.repository }}" --title "ATTEND-PRO 1.9.56 Pairing Discovery Fix" --notes "Field-test build fixing the employee-side BLE pairing discovery filter mismatch seen in the Store connection status. Debug-signed because permanent production signing secrets are unavailable."
