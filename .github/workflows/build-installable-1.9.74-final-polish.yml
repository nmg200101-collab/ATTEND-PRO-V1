name: Build ATTEND-PRO 1.9.74 FINAL POLISH
on:
  push:
    branches: [attend-pro-1.9.74-final-polish]
    paths:
      - '.github/workflows/build-installable-1.9.74-final-polish.yml'
      - 'tools/patch-1.9.74-final-polish.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Prepare stable 1.9.70 source as 1.9.74
        run: |
          rm -rf buildsrc signed
          mkdir buildsrc signed
          unzip -q ATTEND-PRO-1.9.66-FINAL-SOURCE-FIXED.zip -d buildsrc
          sed -i 's/versionCode = 73/versionCode = 81/g; s/versionName = "1.9.66"/versionName = "1.9.74"/g' buildsrc/employee-app/build.gradle.kts buildsrc/store-app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          old='pairingDiscovery.start(envelope.code, PairingDiscovery.Mode.ALL)'
          new='pairingDiscovery.stop()\n        acceptProvision(envelope.provisionText, localChannel = "QR AP5Q")'
          if old in s:
              s=s.replace(old,new,1)
          elif 'acceptProvision(envelope.provisionText' not in s:
              raise SystemExit('stable 1.9.70 AP5Q baseline missing')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Snapshot protected pairing files
        run: |
          sha256sum \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt > /tmp/pairing.sha256
      - name: Apply management baseline and 1.9.74 polish
        run: |
          python3 tools/patch-1.9.71-system-management.py
          python3 tools/fix-1.9.71-self-registration-kotlin.py
          python3 tools/patch-1.9.72-management-ui.py
          python3 tools/patch-1.9.73-management-final.py
          python3 tools/patch-1.9.74-final-polish.py
      - name: Verify protected pairing and final polish
        run: |
          sha256sum -c /tmp/pairing.sha256
          grep -q 'stopBleScanForGatt()' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'requestMtu(247)' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'MAX_GATT_CHUNK_SIZE = 360' buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'addServiceUuid(BleProtocol.SERVICE_UUID)' buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'acceptProvision(envelope.provisionText' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'إدارة النظام 1.9.74' buildsrc/store-app/src/main/java/com/attendpro/store/SystemManagement1971Activity.kt
          grep -q 'بحث بالاسم أو الهاتف' buildsrc/store-app/src/main/java/com/attendpro/store/SystemManagement1971Activity.kt
          grep -q 'تعليم الكل كمقروء' buildsrc/store-app/src/main/java/com/attendpro/store/SystemManagement1971Activity.kt
          grep -q 'إجراء سريع' buildsrc/store-app/src/main/java/com/attendpro/store/SystemManagement1971Activity.kt
          grep -q 'نموذج الأقسام' buildsrc/store-app/src/main/java/com/attendpro/store/SystemSettingsActivity.kt
          grep -q 'dashboard_mode' buildsrc/store-app/src/main/java/com/attendpro/store/SystemSettingsActivity.kt
      - name: Build and regression test
        run: |
          gradle -p buildsrc :core:testDebugUnitTest :employee-app:compileDebugKotlin :store-app:compileDebugKotlin :employee-app:assembleDebug :store-app:assembleDebug :employee-app:assembleRelease :store-app:assembleRelease --stacktrace
      - name: Sign official release with existing certificate
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXPECTED=2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59
          KEYSTORE=/tmp/attend-pro.jks
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          for APP in employee store; do
            if [ "$APP" = employee ]; then
              MOD=employee-app
              OUT=ATTEND-PRO-Employee-1.9.74-FINAL.apk
            else
              MOD=store-app
              OUT=ATTEND-PRO-Store-1.9.74-FINAL.apk
            fi
            UNS=buildsrc/$MOD/build/outputs/apk/release/$MOD-release-unsigned.apk
            test -f "$UNS"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNS" /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" \
              --ks-pass "env:ATTEND_PRO_STORE_PASSWORD" \
              --key-pass "env:ATTEND_PRO_KEY_PASSWORD" \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out signed/$OUT /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs signed/$OUT
            ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs signed/$OUT | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
            test "$ACTUAL" = "$EXPECTED"
          done
          sha256sum signed/*.apk > signed/SHA256SUMS.txt
          printf 'ATTEND-PRO 1.9.74\nStable pairing baseline: 1.9.70\nManagement closure baseline: 1.9.73\nFinal UI polish + dual owner dashboard\nCertificate SHA-256: %s\n' "$EXPECTED" > signed/RELEASE-INFO.txt
      - name: Package final patched source
        run: |
          (cd buildsrc && zip -qr ../signed/ATTEND-PRO-1.9.74-FINAL-SOURCE.zip . -x '*/build/*' '.gradle/*')
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.74-FINAL-SIGNED
          path: signed/*
