name: Build ATTEND-PRO V2.0.0 RC2 PLAY-COMPLIANCE

on:
  workflow_dispatch:
  push:
    branches: [attend-pro-v2.0.0-rc2-play-compliance]

permissions:
  contents: read

concurrency:
  group: attend-pro-v2-rc2-play-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android 16 SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify baseline, version, and distribution contract
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b651ff153f82ed740109a76474b2e52708686fa0 HEAD
          grep -q 'versionCode = 92' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC2"' buildsrc/store-app/build.gradle.kts
          grep -q 'targetSdk = 36' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 92' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC2"' buildsrc/employee-app/build.gradle.kts
          grep -q 'targetSdk = 36' buildsrc/employee-app/build.gradle.kts
          grep -q 'tools:node="remove"' buildsrc/store-app/src/play/AndroidManifest.xml
          grep -q 'tools:node="remove"' buildsrc/employee-app/src/play/AndroidManifest.xml
          sha256sum -c CONNECTION_CORE_LOCK_V2_FOUNDATION.sha256
          python3 tools/guard-1.9.77-core-pairing.py snapshot
          python3 tools/guard-1.9.77-core-pairing.py verify
          PROTECTED=(
            buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
            buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
            buildsrc/core/src/main/java/com/attendpro/core/BleDirectProtocol.kt
            buildsrc/core/src/main/java/com/attendpro/core/BleProtocol.kt
            buildsrc/core/src/main/java/com/attendpro/core/PairingAckProtocol.kt
            buildsrc/core/src/main/java/com/attendpro/core/PairingProtocol.kt
          )
          git diff --exit-code 3b479e310d06bdaec96205aae8787fb264fa02c9 -- "${PROTECTED[@]}"
          grep -q 'app-update:2.1.0' buildsrc/store-app/build.gradle.kts
          grep -q 'app-update:2.1.0' buildsrc/employee-app/build.gradle.kts
          grep -q 'android:name="isMonitoringTool"' buildsrc/employee-app/src/play/AndroidManifest.xml
          grep -q 'android:value="enterprise_management"' buildsrc/employee-app/src/play/AndroidManifest.xml

      - name: Verify V2 security and backup contracts
        run: |
          set -euo pipefail
          grep -q 'AES/GCM/NoPadding' buildsrc/foundation/src/main/java/com/attendpro/foundation/backup/EncryptedBackupCodec.kt
          grep -q 'PBKDF2WithHmacSHA256' buildsrc/foundation/src/main/java/com/attendpro/foundation/backup/EncryptedBackupCodec.kt
          grep -q 'PROTECTED_STORE_PREFIXES' buildsrc/foundation/src/main/java/com/attendpro/foundation/backup/StoreBackupManager.kt
          grep -q 'AttendProApplication' buildsrc/store-app/src/main/AndroidManifest.xml
          grep -q 'AttendProApplication' buildsrc/employee-app/src/main/AndroidManifest.xml
          grep -q 'ENFORCE_OFFICIAL_SIGNATURE' buildsrc/store-app/build.gradle.kts
          grep -q 'ENFORCE_OFFICIAL_SIGNATURE' buildsrc/employee-app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' buildsrc/store-app/build.gradle.kts
          grep -q 'isShrinkResources = true' buildsrc/employee-app/build.gradle.kts
          grep -q 'usesCleartextTraffic="false"' buildsrc/store-app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' buildsrc/employee-app/src/main/AndroidManifest.xml

      - name: Unit, integration, migration, backup, lock, messaging, and regression tests
        run: |
          set -euo pipefail
          gradle -p buildsrc \
            :core:testDebugUnitTest :foundation:testDebugUnitTest \
            :foundation:lintDebug \
            :employee-app:lintDirectRelease :employee-app:lintPlayRelease \
            :store-app:lintDirectRelease :store-app:lintPlayRelease --stacktrace
          python3 tools/guard-1.9.77-core-pairing.py verify
          sha256sum -c CONNECTION_CORE_LOCK_V2_FOUNDATION.sha256

      - name: Build direct APK and Play AAB variants
        run: |
          set -euo pipefail
          gradle -p buildsrc \
            :employee-app:assembleDirectDebug :store-app:assembleDirectDebug \
            :employee-app:assembleDirectRelease :store-app:assembleDirectRelease \
            :employee-app:assemblePlayRelease :store-app:assemblePlayRelease \
            :employee-app:bundlePlayRelease :store-app:bundlePlayRelease --stacktrace
          test -s buildsrc/employee-app/build/outputs/mapping/directRelease/mapping.txt
          test -s buildsrc/store-app/build/outputs/mapping/directRelease/mapping.txt
          test -s buildsrc/employee-app/build/outputs/mapping/playRelease/mapping.txt
          test -s buildsrc/store-app/build/outputs/mapping/playRelease/mapping.txt
          python3 tools/guard-1.9.77-core-pairing.py verify
          sha256sum -c CONNECTION_CORE_LOCK_V2_FOUNDATION.sha256

      - name: Sign direct APKs and Play AABs with official identity
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ATTEND_PRO_KEYSTORE_B64"
          test -n "$ATTEND_PRO_STORE_PASSWORD"
          test -n "$ATTEND_PRO_KEY_ALIAS"
          test -n "$ATTEND_PRO_KEY_PASSWORD"
          mkdir -p signed
          EXPECTED_CERT=2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59
          KEYSTORE=/tmp/attend-pro-v2-rc2-play.jks
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          for APP in employee store; do
            if [ "$APP" = employee ]; then
              MOD=employee-app
              PACKAGE=com.attendpro.employee
              APK_OUT=ATTEND-PRO-Employee-V2.0.0-RC2-PLAY-COMPLIANCE.apk
              AAB_OUT=ATTEND-PRO-Employee-V2.0.0-RC2-PLAY-COMPLIANCE-Play.aab
            else
              MOD=store-app
              PACKAGE=com.attendpro.store
              APK_OUT=ATTEND-PRO-Store-V2.0.0-RC2-PLAY-COMPLIANCE.apk
              AAB_OUT=ATTEND-PRO-Store-V2.0.0-RC2-PLAY-COMPLIANCE-Play.aab
            fi
            UNSIGNED_APK=$(find "buildsrc/$MOD/build/outputs/apk/direct/release" -name '*-unsigned.apk' -print -quit)
            UNSIGNED_AAB=$(find "buildsrc/$MOD/build/outputs/bundle/playRelease" -name '*.aab' -print -quit)
            test -s "$UNSIGNED_APK"
            test -s "$UNSIGNED_AAB"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED_APK" "/tmp/$APP-aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$KEYSTORE" --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" \
              --ks-pass "env:ATTEND_PRO_STORE_PASSWORD" --key-pass "env:ATTEND_PRO_KEY_PASSWORD" \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --out "signed/$APK_OUT" "/tmp/$APP-aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p 4 "signed/$APK_OUT"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "signed/$APK_OUT"
            ACTUAL_CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "signed/$APK_OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
            test "$ACTUAL_CERT" = "$EXPECTED_CERT"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "signed/$APK_OUT" > "/tmp/$APP-badging.txt"
            grep -q "package: name='$PACKAGE' versionCode='92' versionName='2.0.0-RC2'" "/tmp/$APP-badging.txt"

            cp "$UNSIGNED_AAB" "signed/$AAB_OUT"
            jarsigner -keystore "$KEYSTORE" -storepass:env ATTEND_PRO_STORE_PASSWORD -keypass:env ATTEND_PRO_KEY_PASSWORD \
              -sigalg SHA256withRSA -digestalg SHA-256 "signed/$AAB_OUT" "$ATTEND_PRO_KEY_ALIAS"
            jarsigner -verify -verbose -certs "signed/$AAB_OUT" >/tmp/$APP-aab-verify.txt
            grep -q 'jar verified' /tmp/$APP-aab-verify.txt
            AAB_CERT=$(keytool -printcert -jarfile "signed/$AAB_OUT" | sed -n 's/^[[:space:]]*SHA256: //p' | head -1 | tr -d ':' | tr A-F a-f)
            test "$AAB_CERT" = "$EXPECTED_CERT"
            PLAY_APK=$(find "buildsrc/$MOD/build/outputs/apk/play/release" -name '*-unsigned.apk' -print -quit)
            test -s "$PLAY_APK"
            APKA="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
            test -x "$APKA"
            test "$("$APKA" manifest application-id "$PLAY_APK")" = "$PACKAGE"
            test "$("$APKA" manifest version-code "$PLAY_APK")" = "92"
            if "$APKA" manifest permissions "$PLAY_APK" | grep -q 'android.permission.REQUEST_INSTALL_PACKAGES'; then
              echo "Play AAB must not request package installation permission" >&2
              exit 1
            fi
            if ! "$APKA" manifest permissions "signed/$APK_OUT" | grep -q 'android.permission.REQUEST_INSTALL_PACKAGES'; then
              echo "Direct APK must retain REQUEST_INSTALL_PACKAGES for the explicit user-approved updater" >&2
              exit 1
            fi
            if unzip -p "$PLAY_APK" 'classes*.dex' | strings | grep -Fq '/api/v1/app/update'; then
              echo "Play APK contains the direct APK update endpoint" >&2
              exit 1
            fi
            if [ "$APP" = employee ]; then
              "$APKA" manifest print "$PLAY_APK" > "/tmp/employee-play-manifest.txt"
              grep -q 'isMonitoringTool' "/tmp/employee-play-manifest.txt"
              grep -q 'enterprise_management' "/tmp/employee-play-manifest.txt"
            fi
          done

      - name: Package RC documentation and reproducible source
        run: |
          set -euo pipefail
          cp ARCHITECTURE_V2_FOUNDATION.md signed/
          cp MIGRATION_REPORT_V2_FOUNDATION.md signed/
          cp RELEASE_NOTES_V2.0.0_RC2.md signed/
          cp BACKUP_RESTORE_SECURITY_V2.md signed/
          cp PLAY_COMPLIANCE_REPORT_RC2.md signed/
          cp FIELD_TEST_CHECKLIST_RC2.md signed/
          cp CONNECTION_CORE_LOCK_V2_FOUNDATION.sha256 signed/
          cp buildsrc/store-app/build/outputs/mapping/directRelease/mapping.txt signed/STORE-DIRECT-R8-MAPPING-OWNER-ONLY.txt
          cp buildsrc/employee-app/build/outputs/mapping/directRelease/mapping.txt signed/EMPLOYEE-DIRECT-R8-MAPPING-OWNER-ONLY.txt
          cp buildsrc/store-app/build/outputs/mapping/playRelease/mapping.txt signed/STORE-PLAY-R8-MAPPING-OWNER-ONLY.txt
          cp buildsrc/employee-app/build/outputs/mapping/playRelease/mapping.txt signed/EMPLOYEE-PLAY-R8-MAPPING-OWNER-ONLY.txt
          git archive --format=zip --prefix=ATTEND-PRO-V2.0.0-RC2-PLAY-COMPLIANCE/ --output=signed/ATTEND-PRO-V2.0.0-RC2-PLAY-COMPLIANCE-SOURCE.zip HEAD
          {
            printf 'ATTEND-PRO V2.0.0-RC2-PLAY-COMPLIANCE\n'
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Workflow run: %s\n' "$GITHUB_RUN_ID"
            printf 'Protected baseline: b651ff153f82ed740109a76474b2e52708686fa0\n'
            printf 'Field pairing reference: ATTEND-PRO 1.9.70 STABLE BASE\n'
            printf 'Version code: 92\nTarget SDK: 36\n'
            printf 'Official certificate SHA-256: 2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59\n'
            printf 'Main branch merged: NO\n'
          } > signed/RELEASE-MANIFEST.txt
          {
            printf 'Protected connection diff against RC1 baseline 3b479e310d06bdaec96205aae8787fb264fa02c9\n'
            sha256sum \
              buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt \
              buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt \
              buildsrc/core/src/main/java/com/attendpro/core/BleDirectProtocol.kt \
              buildsrc/core/src/main/java/com/attendpro/core/BleProtocol.kt \
              buildsrc/core/src/main/java/com/attendpro/core/PairingAckProtocol.kt \
              buildsrc/core/src/main/java/com/attendpro/core/PairingProtocol.kt
            git diff --name-status 3b479e310d06bdaec96205aae8787fb264fa02c9 -- \
              buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt \
              buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt \
              buildsrc/core/src/main/java/com/attendpro/core/BleDirectProtocol.kt \
              buildsrc/core/src/main/java/com/attendpro/core/BleProtocol.kt \
              buildsrc/core/src/main/java/com/attendpro/core/PairingAckProtocol.kt \
              buildsrc/core/src/main/java/com/attendpro/core/PairingProtocol.kt
          } > signed/CONNECTION-PROTECTED-DIFF.txt
          (cd signed && find . -maxdepth 1 -type f ! -name ALL-SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > ALL-SHA256SUMS.txt)
          (cd signed && sha256sum -c ALL-SHA256SUMS.txt)

      - name: Upload signed RC bundle
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-V2.0.0-RC2-PLAY-COMPLIANCE-SIGNED
          path: signed/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-V2.0.0-RC2-PLAY-COMPLIANCE-TEST-REPORTS
          path: |
            buildsrc/core/build/reports/tests/
            buildsrc/foundation/build/reports/tests/
            buildsrc/foundation/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30
