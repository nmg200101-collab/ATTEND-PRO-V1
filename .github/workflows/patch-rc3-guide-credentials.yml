name: RC3 one-shot guide credential patch

on:
  push:
    branches: [attend-pro-v2.0.0-rc2-play-compliance]
    paths:
      - '.github/workflows/patch-rc3-guide-credentials.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: attend-pro-v2.0.0-rc2-play-compliance
          fetch-depth: 0
      - name: Apply RC3 guide credential topics
        run: |
          set -euo pipefail
          python3 tools/patch_rc3_guide_credentials.py
          git diff --check
          grep -q 'agent_credential' buildsrc/store-app/src/main/java/com/attendpro/store/StoreUserGuideActivity.kt
          grep -q 'subscriber_recovery' buildsrc/store-app/src/main/java/com/attendpro/store/StoreUserGuideActivity.kt
          git config user.name 'attend-pro-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add buildsrc/store-app/src/main/java/com/attendpro/store/StoreUserGuideActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'RC3: document agent credentials and subscriber recovery'
          git push origin HEAD:attend-pro-v2.0.0-rc2-play-compliance
