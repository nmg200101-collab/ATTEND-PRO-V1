name: Build ATTEND-PRO 1.9.82 ANTI TAMPER
on:
  push:
    branches: [attend-pro-1.9.82-anti-tamper]
    paths:
      - '.github/workflows/build-installable-1.9.77-final.yml'
      - 'tools/patch-1.9.82-anti-tamper.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare 1.9.82 from stable source
        run: |
          set -euo pipefail
          rm -rf buildsrc signed
          mkdir buildsrc signed
          unzip -q ATTEND-PRO-1.9.66-FINAL-SOURCE-FIXED.zip -d buildsrc
          sed -i 's/versionCode = 73/versionCode = 89/g; s/versionName = "1.9.66"/versionName = "1.9.82"/g' buildsrc/employee-app/build.gradle.kts buildsrc/store-app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          old='pairingDiscovery.start(envelope.code, PairingDiscovery.Mode.ALL)'
          new='pairingDiscovery.stop()\n        acceptProvision(envelope.provisionText, localChannel = "QR AP5Q")'
          if old in s: s=s.replace(old,new,1)
          elif 'acceptProvision(envelope.provisionText' not in s: raise SystemExit('stable AP5Q baseline missing')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Rebuild exact 1.9.81 release-candidate baseline
        run: |
          set -euo pipefail
          python3 tools/patch-1.9.71-system-management.py
          python3 tools/fix-1.9.71-self-registration-kotlin.py
          python3 tools/patch-1.9.72-management-ui.py
          python3 tools/patch-1.9.73-management-final.py
          python3 tools/patch-1.9.74-final-polish.py
          python3 tools/fix-1.9.74-missing-helpers.py
          python3 tools/patch-1.9.75-store-management.py
          python3 tools/fix-1.9.75-store-message-receiver.py
          python3 tools/patch-1.9.76-simplified-navigation.py
          python3 tools/patch-1.9.77-navigation-connection-offline-messaging.py
          python3 tools/patch-1.9.78-semi-final-home-ui.py
          python3 tools/patch-1.9.78-terminology-polish.py
          python3 tools/patch-1.9.79-agent-entry-fix.py
          python3 tools/patch-1.9.80-security-hardening.py
          python3 tools/patch-1.9.81-release-candidate-stability.py

      - name: Snapshot protected pairing and connection core
        run: python3 tools/guard-1.9.77-core-pairing.py snapshot

      - name: Apply 1.9.82 anti-tamper hardening
        run: python3 tools/patch-1.9.82-anti-tamper.py

      - name: Verify protected core and anti-tamper contract
        run: |
          set -euo pipefail
          python3 tools/guard-1.9.77-core-pairing.py verify
          grep -q 'stopBleScanForGatt()' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'requestMtu(247)' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'MAX_GATT_CHUNK_SIZE = 360' buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'addServiceUuid(BleProtocol.SERVICE_UUID)' buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'sendLocalMessage' buildsrc/store-app/src/main/java/com/attendpro/store/BleDirectLinkClient.kt
          grep -q 'OFFICIAL_CERT_SHA256' buildsrc/core/src/main/java/com/attendpro/core/AppIntegrity1982.kt
          grep -q 'ENFORCE_OFFICIAL_SIGNATURE' buildsrc/store-app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' buildsrc/store-app/build.gradle.kts
          grep -q 'isShrinkResources = true' buildsrc/store-app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' buildsrc/employee-app/build.gradle.kts
          grep -q 'isShrinkResources = true' buildsrc/employee-app/build.gradle.kts
          grep -q 'usesCleartextTraffic="false"' buildsrc/store-app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' buildsrc/employee-app/src/main/AndroidManifest.xml
          grep -q 'enforceOfficialBuild1982' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'enforceOfficialBuild1982' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'FLAG_SECURE' buildsrc/store-app/src/main/java/com/attendpro/store/SystemManagement1971Activity.kt
          grep -q 'activeInstrumentationDetected' buildsrc/store-app/src/main/java/com/attendpro/store/SystemManagement1971Activity.kt
          grep -q 'FLAG_SECURE' buildsrc/store-app/src/main/java/com/attendpro/store/SystemSettingsActivity.kt
          grep -q 'FLAG_SECURE' buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt

      - name: Core tests
        run: gradle -p buildsrc :core:testDebugUnitTest --stacktrace

      - name: Compile debug and build minified release APKs
        run: |
          gradle -p buildsrc \
            :employee-app:compileDebugKotlin :store-app:compileDebugKotlin \
            :employee-app:assembleDebug :store-app:assembleDebug \
            :employee-app:assembleRelease :store-app:assembleRelease --stacktrace
          test -s buildsrc/employee-app/build/outputs/mapping/release/mapping.txt
          test -s buildsrc/store-app/build/outputs/mapping/release/mapping.txt
          wc -l buildsrc/employee-app/build/outputs/mapping/release/mapping.txt
          wc -l buildsrc/store-app/build/outputs/mapping/release/mapping.txt

      - name: Sign official release with stable certificate
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXPECTED=2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59
          KEYSTORE=/tmp/attend-pro.jks
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          for APP in employee store; do
            if [ "$APP" = employee ]; then MOD=employee-app; OUT=ATTEND-PRO-Employee-1.9.82-PROTECTED.apk; else MOD=store-app; OUT=ATTEND-PRO-Store-1.9.82-PROTECTED.apk; fi
            UNS=buildsrc/$MOD/build/outputs/apk/release/$MOD-release-unsigned.apk
            test -f "$UNS"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNS" /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" --ks-pass "env:ATTEND_PRO_STORE_PASSWORD" --key-pass "env:ATTEND_PRO_KEY_PASSWORD" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out signed/$OUT /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs signed/$OUT
            ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs signed/$OUT | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
            test "$ACTUAL" = "$EXPECTED"
          done
          sha256sum signed/*.apk > signed/SHA256SUMS.txt
          cp buildsrc/store-app/build/outputs/mapping/release/mapping.txt signed/STORE-R8-MAPPING-OWNER-ONLY.txt
          cp buildsrc/employee-app/build/outputs/mapping/release/mapping.txt signed/EMPLOYEE-R8-MAPPING-OWNER-ONLY.txt
          printf 'ATTEND-PRO 1.9.82 PROTECTED\nBase: 1.9.81 RC\nRelease R8 obfuscation + resource shrinking enabled\nRuntime official signing-certificate enforcement enabled\nHTTPS-only network policy enabled\nSensitive management screens protected with FLAG_SECURE\nActive debugger/tracer/instrumentation blocks privileged System Management\nProtected pairing/BLE/QR/GATT/heartbeat/local-message core unchanged\nImportant: keep R8 mapping files private; they de-obfuscate crash traces and code names.\nCertificate SHA-256: %s\n' "$EXPECTED" > signed/RELEASE-INFO.txt

      - name: Package protected source backup
        run: |
          rm -rf buildsrc/central-server
          cat > buildsrc/CLOUD_SERVER_REFERENCE.md <<'EOF'
          # ATTEND-PRO Cloud Server
          Production server repository: nmg200101-collab/ATTEND-PRO-CLOUDFLARE-SERVER
          Keep production authorization and business-critical secrets server-side.
          EOF
          (cd buildsrc && zip -qr ../signed/ATTEND-PRO-1.9.82-PROTECTED-SOURCE.zip . -x '*/build/*' '.gradle/*')

      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.82-PROTECTED-SIGNED
          path: signed/*
