name: Build ATTEND-PRO 1.9.77 FINAL
on:
  push:
    branches: [attend-pro-1.9.77-navigation-connection-offline-messaging]
    paths:
      - '.github/workflows/build-installable-1.9.77-final.yml'
      - 'tools/patch-1.9.77-navigation-connection-offline-messaging.py'
      - 'tools/guard-1.9.77-core-pairing.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare 1.9.77 from stable source
        run: |
          set -euo pipefail
          rm -rf buildsrc signed
          mkdir buildsrc signed
          unzip -q ATTEND-PRO-1.9.66-FINAL-SOURCE-FIXED.zip -d buildsrc
          sed -i 's/versionCode = 73/versionCode = 84/g; s/versionName = "1.9.66"/versionName = "1.9.77"/g' buildsrc/employee-app/build.gradle.kts buildsrc/store-app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          old='pairingDiscovery.start(envelope.code, PairingDiscovery.Mode.ALL)'
          new='pairingDiscovery.stop()\n        acceptProvision(envelope.provisionText, localChannel = "QR AP5Q")'
          if old in s: s=s.replace(old,new,1)
          elif 'acceptProvision(envelope.provisionText' not in s: raise SystemExit('stable AP5Q baseline missing')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Rebuild exact 1.9.76 feature baseline
        run: |
          set -euo pipefail
          python3 tools/patch-1.9.71-system-management.py
          python3 tools/fix-1.9.71-self-registration-kotlin.py
          python3 tools/patch-1.9.72-management-ui.py
          python3 tools/patch-1.9.73-management-final.py
          python3 tools/patch-1.9.74-final-polish.py
          python3 tools/fix-1.9.74-missing-helpers.py
          python3 tools/patch-1.9.75-store-management.py
          python3 tools/fix-1.9.75-store-message-receiver.py
          python3 tools/patch-1.9.76-simplified-navigation.py

      - name: Snapshot protected pairing and connection core
        run: python3 tools/guard-1.9.77-core-pairing.py snapshot

      - name: Apply 1.9.77 navigation connection and offline messaging
        run: python3 tools/patch-1.9.77-navigation-connection-offline-messaging.py

      - name: Verify protected pairing core unchanged
        run: |
          set -euo pipefail
          python3 tools/guard-1.9.77-core-pairing.py verify
          grep -q 'stopBleScanForGatt()' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'requestMtu(247)' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'MAX_GATT_CHUNK_SIZE = 360' buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'addServiceUuid(BleProtocol.SERVICE_UUID)' buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'acceptProvision(envelope.provisionText' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'BleLocalMessageProtocol1977' buildsrc/core/src/main/java/com/attendpro/core/BleLocalMessageProtocol1977.kt
          grep -q 'auth.confirmed' buildsrc/employee-app/src/main/java/com/attendpro/employee/BleDirectLinkServer.kt
          grep -q 'sendLocalMessage' buildsrc/store-app/src/main/java/com/attendpro/store/BleDirectLinkClient.kt
          grep -q 'StoreDirectLinkBridge1977.sendMessage' buildsrc/store-app/src/main/java/com/attendpro/store/StoreMessages1975Activity.kt
          grep -q 'مباشر بدون إنترنت' buildsrc/employee-app/src/main/java/com/attendpro/employee/EmployeeMessages1975Activity.kt
          grep -q 'إدارة الاتصال' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'navigationScreen1977' buildsrc/store-app/src/main/java/com/attendpro/store/SystemSettingsActivity.kt

      - name: Core protocol unit tests
        run: gradle -p buildsrc :core:testDebugUnitTest --stacktrace

      - name: Compile and assemble both apps
        run: |
          gradle -p buildsrc \
            :employee-app:compileDebugKotlin :store-app:compileDebugKotlin \
            :employee-app:assembleDebug :store-app:assembleDebug \
            :employee-app:assembleRelease :store-app:assembleRelease --stacktrace

      - name: Sign official release with stable certificate
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXPECTED=2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59
          KEYSTORE=/tmp/attend-pro.jks
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          for APP in employee store; do
            if [ "$APP" = employee ]; then MOD=employee-app; OUT=ATTEND-PRO-Employee-1.9.77-FINAL.apk; else MOD=store-app; OUT=ATTEND-PRO-Store-1.9.77-FINAL.apk; fi
            UNS=buildsrc/$MOD/build/outputs/apk/release/$MOD-release-unsigned.apk
            test -f "$UNS"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNS" /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$KEYSTORE" --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" \
              --ks-pass "env:ATTEND_PRO_STORE_PASSWORD" --key-pass "env:ATTEND_PRO_KEY_PASSWORD" \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --out signed/$OUT /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs signed/$OUT
            ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs signed/$OUT | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
            test "$ACTUAL" = "$EXPECTED"
          done
          sha256sum signed/*.apk > signed/SHA256SUMS.txt
          printf 'ATTEND-PRO 1.9.77\nBase: 1.9.76\nSequential layered navigation\nEmployee connection control and restart\nAuthenticated Store-to-Employee BLE local messaging without Internet with server fallback\nCore pairing/BleDirectProtocol/heartbeat-reconnect guards passed\nCertificate SHA-256: %s\n' "$EXPECTED" > signed/RELEASE-INFO.txt

      - name: Package final source
        run: (cd buildsrc && zip -qr ../signed/ATTEND-PRO-1.9.77-FINAL-SOURCE.zip . -x '*/build/*' '.gradle/*')

      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.77-FINAL-SIGNED
          path: signed/*
