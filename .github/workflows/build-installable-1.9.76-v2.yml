name: Build ATTEND-PRO 1.9.76 FINAL
on:
  push:
    branches: [attend-pro-1.9.76-simplified-navigation]
    paths:
      - '.github/workflows/build-installable-1.9.76-v2.yml'
      - 'tools/patch-1.9.76-simplified-navigation.py'
      - 'tools/guard-1.9.76-pairing.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare 1.9.76 from stable source
        run: |
          rm -rf buildsrc signed
          mkdir buildsrc signed
          unzip -q ATTEND-PRO-1.9.66-FINAL-SOURCE-FIXED.zip -d buildsrc
          sed -i 's/versionCode = 73/versionCode = 83/g; s/versionName = "1.9.66"/versionName = "1.9.76"/g' buildsrc/employee-app/build.gradle.kts buildsrc/store-app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p=Path('buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt')
          s=p.read_text(encoding='utf-8')
          old='pairingDiscovery.start(envelope.code, PairingDiscovery.Mode.ALL)'
          new='pairingDiscovery.stop()\n        acceptProvision(envelope.provisionText, localChannel = "QR AP5Q")'
          if old in s: s=s.replace(old,new,1)
          elif 'acceptProvision(envelope.provisionText' not in s: raise SystemExit('stable 1.9.70 AP5Q baseline missing')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Rebuild signed 1.9.75 feature baseline
        run: |
          python3 tools/patch-1.9.71-system-management.py
          python3 tools/fix-1.9.71-self-registration-kotlin.py
          python3 tools/patch-1.9.72-management-ui.py
          python3 tools/patch-1.9.73-management-final.py
          python3 tools/patch-1.9.74-final-polish.py
          python3 tools/fix-1.9.74-missing-helpers.py
          python3 tools/patch-1.9.75-store-management.py
          python3 tools/fix-1.9.75-store-message-receiver.py

      - name: Lock pairing implementation
        run: python3 tools/guard-1.9.76-pairing.py snapshot

      - name: Apply simplified navigation 1.9.76
        run: python3 tools/patch-1.9.76-simplified-navigation.py

      - name: Verify pairing untouched and UI contract
        run: |
          set -euo pipefail
          python3 tools/guard-1.9.76-pairing.py verify
          grep -q 'stopBleScanForGatt()' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'requestMtu(247)' buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt
          grep -q 'MAX_GATT_CHUNK_SIZE = 360' buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'addServiceUuid(BleProtocol.SERVICE_UUID)' buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt
          grep -q 'acceptProvision(envelope.provisionText' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'showStoreTopMenu1976' buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          grep -q 'الإعدادات المتقدمة' buildsrc/store-app/src/main/java/com/attendpro/store/StoreSettingsActivity.kt
          grep -q 'showStoreMainMenu1976' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'showEmployeeEditorAdvanced' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'إدارة الموظفين' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'showEmployeeMainMenu1976' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'دليل مستخدم الموظف' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'الإشعارات ودليل المستخدم والإعدادات موجودة في قائمة' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt

      - name: Build and regression test
        run: |
          gradle -p buildsrc :core:testDebugUnitTest :employee-app:compileDebugKotlin :store-app:compileDebugKotlin :employee-app:assembleDebug :store-app:assembleDebug :employee-app:assembleRelease :store-app:assembleRelease --stacktrace

      - name: Sign official release
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          EXPECTED=2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59
          KEYSTORE=/tmp/attend-pro.jks
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          for APP in employee store; do
            if [ "$APP" = employee ]; then MOD=employee-app; OUT=ATTEND-PRO-Employee-1.9.76-FINAL.apk; else MOD=store-app; OUT=ATTEND-PRO-Store-1.9.76-FINAL.apk; fi
            UNS=buildsrc/$MOD/build/outputs/apk/release/$MOD-release-unsigned.apk
            test -f "$UNS"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNS" /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" --ks-pass "env:ATTEND_PRO_STORE_PASSWORD" --key-pass "env:ATTEND_PRO_KEY_PASSWORD" --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out signed/$OUT /tmp/$APP.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs signed/$OUT
            ACTUAL=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs signed/$OUT | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
            test "$ACTUAL" = "$EXPECTED"
          done
          sha256sum signed/*.apk > signed/SHA256SUMS.txt
          printf 'ATTEND-PRO 1.9.76\nBase: 1.9.75\nSimplified Store and Employee navigation\nTop menu: notifications + user guide + settings\nProtected pairing/transport implementation unchanged\nCertificate SHA-256: %s\n' "$EXPECTED" > signed/RELEASE-INFO.txt

      - name: Package source
        run: (cd buildsrc && zip -qr ../signed/ATTEND-PRO-1.9.76-FINAL-SOURCE.zip . -x '*/build/*' '.gradle/*')

      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.76-FINAL-SIGNED
          path: signed/*
