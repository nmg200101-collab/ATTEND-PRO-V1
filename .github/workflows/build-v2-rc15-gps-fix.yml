name: Build ATTEND-PRO V2.0.0 RC15 GPS FIX

on:
  workflow_dispatch:
  push:
    branches: [attend-pro-v2.0.0-rc2-play-compliance]

permissions:
  contents: read

concurrency:
  group: attend-pro-v2-rc15-gps-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Apply deterministic RC15 GPS fix
        run: |
          set -euo pipefail
          python3 tools/apply-rc8-employee-pairing-fix.py
          python3 tools/apply-rc11-live-connection-fix.py
          python3 tools/apply-rc12-radio-recovery.py

          sha256sum \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/BlePresenceAdvertiser.kt \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/BleDirectLinkServer.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/BleEmployeeScanner.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/BleDirectLinkClient.kt \
            > /tmp/RC12_BLUETOOTH_RUNTIME_LOCK.sha256

          python3 tools/apply-rc13-gps-primary-presence.py

          git show 3c8e8e2394435ccbfd2d10d72314c63199e5a478:tools/apply-rc14-gps-first-setup.py > /tmp/apply-rc14-known-good.py
          python3 /tmp/apply-rc14-known-good.py

          python3 tools/apply-rc14-gps-zone-hotfix.py
          python3 tools/apply-rc14-gps-ble-telemetry.py

          sed -i 's/versionCode = 104/versionCode = 105/g; s/versionName = "2.0.0-RC14"/versionName = "2.0.0-RC15"/g' buildsrc/store-app/build.gradle.kts buildsrc/employee-app/build.gradle.kts

          sha256sum -c /tmp/RC12_BLUETOOTH_RUNTIME_LOCK.sha256
          grep -q 'versionCode = 105' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC15"' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 105' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-RC15"' buildsrc/employee-app/build.gradle.kts
          grep -q 'GPS • منطقة التعرف على هاتف الموظف' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'refreshGpsConfigToEmployeesRc14Fix' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'GPS • منطقة المحل' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q '__APGPS1|' buildsrc/employee-app/src/main/java/com/attendpro/employee/PresenceService.kt
          grep -q 'attend_ble_gps_telemetry' buildsrc/store-app/src/main/java/com/attendpro/store/StoreLocalReplyStore1977.kt
          grep -q 'Bluetooth GPS' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt

          sha256sum -c CONNECTION_CORE_LOCK_V2_FOUNDATION.sha256
          python3 tools/guard-1.9.77-core-pairing.py snapshot
          python3 tools/guard-1.9.77-core-pairing.py verify
          git diff --exit-code 3b479e310d06bdaec96205aae8787fb264fa02c9 -- \
            buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt \
            buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt \
            buildsrc/core/src/main/java/com/attendpro/core/BleDirectProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/BleProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/PairingAckProtocol.kt \
            buildsrc/core/src/main/java/com/attendpro/core/PairingProtocol.kt

      - name: Test and build RC15
        run: |
          set -euo pipefail
          gradle -p buildsrc \
            :core:testDebugUnitTest :foundation:testDebugUnitTest \
            :employee-app:testDirectDebugUnitTest :store-app:testDirectDebugUnitTest \
            :employee-app:compileDirectDebugKotlin :store-app:compileDirectDebugKotlin \
            :employee-app:assembleDirectRelease :store-app:assembleDirectRelease \
            :employee-app:bundlePlayRelease :store-app:bundlePlayRelease --stacktrace
          python3 tools/guard-1.9.77-core-pairing.py verify
          sha256sum -c CONNECTION_CORE_LOCK_V2_FOUNDATION.sha256
          sha256sum -c /tmp/RC12_BLUETOOTH_RUNTIME_LOCK.sha256

      - name: Sign official RC15 packages
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signed
          KEYSTORE=/tmp/attend-pro-rc15.jks
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          EXPECTED_CERT=2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59
          for APP in employee store; do
            if [ "$APP" = employee ]; then
              MOD=employee-app; PACKAGE=com.attendpro.employee
              APK_OUT=ATTEND-PRO-Employee-V2.0.0-RC15.apk
              AAB_OUT=ATTEND-PRO-Employee-V2.0.0-RC15-Play.aab
            else
              MOD=store-app; PACKAGE=com.attendpro.store
              APK_OUT=ATTEND-PRO-Store-V2.0.0-RC15.apk
              AAB_OUT=ATTEND-PRO-Store-V2.0.0-RC15-Play.aab
            fi
            UNSIGNED_APK=$(find "buildsrc/$MOD/build/outputs/apk/direct/release" -name '*-unsigned.apk' -print -quit)
            UNSIGNED_AAB=$(find "buildsrc/$MOD/build/outputs/bundle/playRelease" -name '*.aab' -print -quit)
            test -s "$UNSIGNED_APK"
            test -s "$UNSIGNED_AAB"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -f -p 4 "$UNSIGNED_APK" "/tmp/$APP-aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
              --ks "$KEYSTORE" --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" \
              --ks-pass "env:ATTEND_PRO_STORE_PASSWORD" --key-pass "env:ATTEND_PRO_KEY_PASSWORD" \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --out "signed/$APK_OUT" "/tmp/$APP-aligned.apk"
            ACTUAL_CERT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "signed/$APK_OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
            test "$ACTUAL_CERT" = "$EXPECTED_CERT"
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "signed/$APK_OUT" > "/tmp/$APP-badging.txt"
            grep -q "package: name='$PACKAGE' versionCode='105' versionName='2.0.0-RC15'" "/tmp/$APP-badging.txt"
            cp "$UNSIGNED_AAB" "signed/$AAB_OUT"
            jarsigner -keystore "$KEYSTORE" -storepass:env ATTEND_PRO_STORE_PASSWORD -keypass:env ATTEND_PRO_KEY_PASSWORD -sigalg SHA256withRSA -digestalg SHA-256 "signed/$AAB_OUT" "$ATTEND_PRO_KEY_ALIAS"
            jarsigner -verify "signed/$AAB_OUT" >/dev/null
          done

      - name: Package RC15 reports
        run: |
          set -euo pipefail
          cp RELEASE_NOTES_V2.0.0_RC14.md FIELD_TEST_CHECKLIST_RC14.md signed/
          cp /tmp/RC12_BLUETOOTH_RUNTIME_LOCK.sha256 signed/RC12-BLUETOOTH-RUNTIME-LOCK.sha256
          {
            echo 'RC15 GPS field checks'
            grep -n 'GPS • منطقة التعرف على هاتف الموظف' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt | head
            grep -n 'refreshGpsConfigToEmployeesRc14Fix' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt | head
            grep -n 'GPS • منطقة المحل' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt | head
            grep -n '__APGPS1|' buildsrc/employee-app/src/main/java/com/attendpro/employee/PresenceService.kt | head
            grep -n 'Bluetooth GPS' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt | head
          } > signed/RC15-GPS-FIELD-CHECK.txt
          {
            echo 'Protected pairing diff against field baseline'
            echo 'protected_changed:'
            git diff --name-only 3b479e310d06bdaec96205aae8787fb264fa02c9 -- \
              buildsrc/employee-app/src/main/java/com/attendpro/employee/PairingDiscovery.kt \
              buildsrc/store-app/src/main/java/com/attendpro/store/PairingBeacon.kt \
              buildsrc/core/src/main/java/com/attendpro/core/BleDirectProtocol.kt \
              buildsrc/core/src/main/java/com/attendpro/core/BleProtocol.kt \
              buildsrc/core/src/main/java/com/attendpro/core/PairingAckProtocol.kt \
              buildsrc/core/src/main/java/com/attendpro/core/PairingProtocol.kt
          } > signed/CONNECTION-PROTECTED-DIFF.txt
          (cd signed && sha256sum * > ALL-SHA256SUMS.txt)
          mkdir -p test-reports
          find buildsrc -path '*/build/test-results/*' -type f -exec cp --parents {} test-reports/ \; || true
          cp signed/RC15-GPS-FIELD-CHECK.txt signed/CONNECTION-PROTECTED-DIFF.txt signed/RC12-BLUETOOTH-RUNTIME-LOCK.sha256 signed/ALL-SHA256SUMS.txt test-reports/

      - name: Upload RC15 signed bundle
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-V2.0.0-RC15-GPS-FIX-SIGNED
          path: signed/
          retention-days: 30

      - name: Upload RC15 test reports
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-V2.0.0-RC15-GPS-FIX-TEST-REPORTS
          path: test-reports/
          retention-days: 30
