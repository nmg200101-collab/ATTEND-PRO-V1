name: Build ATTEND-PRO 1.9.46

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract 1.9.44 baseline
        run: |
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q ATTEND-PRO-V1-source-1.9.44.zip -d buildsrc

      - name: Reconstruct and verify 1.9.46 patch
        run: |
          cat .source_patches/1.9.46/part-*.b64 > /tmp/attend-pro-1.9.46.patch.xz.b64
          base64 -d -i /tmp/attend-pro-1.9.46.patch.xz.b64 > /tmp/attend-pro-1.9.46.patch.xz
          xz -dc /tmp/attend-pro-1.9.46.patch.xz > /tmp/attend-pro-1.9.46.patch
          echo "993a2d000ed5c98af2d0dbfb03a8081f468dfec0830e05d71db5ecfde9127193  /tmp/attend-pro-1.9.46.patch" | sha256sum -c -

      - name: Apply 1.9.46 connection fix
        run: |
          patch -d buildsrc -p1 --batch < /tmp/attend-pro-1.9.46.patch
          grep -q 'versionName = "1.9.46"' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "1.9.46"' buildsrc/store-app/build.gradle.kts

      - name: Apply Employee constructor compile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt")
          text = p.read_text()
          old = 'networkPresence = NetworkPresenceBroadcaster { msg -> runOnUiThread { if (::status.isInitialized) status.text = msg } }'
          new = 'networkPresence = NetworkPresenceBroadcaster(onStatus = { msg -> runOnUiThread { if (::status.isInitialized) status.text = msg } })'
          if old not in text:
              raise SystemExit("Expected NetworkPresenceBroadcaster constructor call not found")
          p.write_text(text.replace(old, new, 1))
          PY
          grep -q 'NetworkPresenceBroadcaster(onStatus =' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt

      - name: Run connection protocol unit tests
        run: |
          gradle -p buildsrc :core:testDebugUnitTest --stacktrace

      - name: Build Employee and Store APKs
        run: |
          gradle -p buildsrc \
            :employee-app:assembleDebug \
            :store-app:assembleDebug \
            --stacktrace

      - name: Package patched source
        run: |
          (cd buildsrc && zip -qr ../ATTEND-PRO-V1-source-1.9.46.zip .)

      - name: Upload Employee APK
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Employee-1.9.46-debug
          path: buildsrc/employee-app/build/outputs/apk/debug/employee-app-debug.apk

      - name: Upload Store APK
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Store-1.9.46-debug
          path: buildsrc/store-app/build/outputs/apk/debug/store-app-debug.apk

      - name: Upload patched source
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-V1-source-1.9.46
          path: ATTEND-PRO-V1-source-1.9.46.zip
