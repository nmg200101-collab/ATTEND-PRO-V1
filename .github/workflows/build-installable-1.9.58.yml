name: Build ATTEND-PRO 1.9.58 Connection Stability GPS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-installable-1.9.58.yml'
      - '.source_patches/1.9.58/**'

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct verified 1.9.57 baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf base_art buildsrc
          mkdir -p base_art buildsrc
          gh run download 34045597410 -R "${{ github.repository }}" -n ATTEND-PRO-1.9.57-REAL-PAIRING-VERIFICATION -D base_art
          SRC=$(find base_art -name 'ATTEND-PRO-V1-source-1.9.57-REAL-PAIRING.zip' -print -quit)
          test -n "$SRC"
          unzip -q "$SRC" -d buildsrc
          test -f buildsrc/settings.gradle.kts

      - name: Reconstruct and verify 1.9.58 patch
        run: |
          set -euo pipefail
          cat .source_patches/1.9.58/connection-gps.part{1,2,3,4}.b64 | tr -d '\r\n' > /tmp/1958.b64
          echo 'a6a98af0443a9eab69f0969adbb36f2226f87ecdbbe5943297916c32601b5e27  /tmp/1958.b64' | sha256sum -c -
          base64 -d /tmp/1958.b64 | xz -dc > /tmp/1958.patch
          echo 'b1998ed68c6351d81ec6c4a1a4ad4b909346ee01cd968f81ca399a0010774511  /tmp/1958.patch' | sha256sum -c -
          (cd buildsrc && patch -p1 --batch < /tmp/1958.patch)

      - name: Static 1.9.58 regression audit
        run: |
          set -euo pipefail
          grep -q 'versionCode = 65' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "1.9.58"' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionCode = 65' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "1.9.58"' buildsrc/store-app/build.gradle.kts
          grep -q 'GPS' buildsrc/employee-app/src/main/java/com/attendpro/employee/OfflineGeoMonitor.kt
          grep -q 'reconnect' buildsrc/store-app/src/main/java/com/attendpro/store/BleDirectLinkClient.kt
          grep -q 'lastAck' buildsrc/store-app/src/main/java/com/attendpro/store/BleDirectLinkClient.kt
          grep -q 'gps' buildsrc/core/src/main/java/com/attendpro/core/CentralServerClient.kt
          grep -q 'GPS' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt

      - name: Core tests and Kotlin compile
        run: |
          gradle -p buildsrc :core:testDebugUnitTest :employee-app:compileDebugKotlin :store-app:compileDebugKotlin --stacktrace

      - name: Build debug and unsigned release APKs
        run: |
          gradle -p buildsrc :employee-app:assembleDebug :store-app:assembleDebug :employee-app:assembleRelease :store-app:assembleRelease --stacktrace

      - name: Verify packages and version
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          EMPD=buildsrc/employee-app/build/outputs/apk/debug/employee-app-debug.apk
          STD=buildsrc/store-app/build/outputs/apk/debug/store-app-debug.apk
          "$AAPT" dump badging "$EMPD" | tee employee-badging.txt
          "$AAPT" dump badging "$STD" | tee store-badging.txt
          grep -q "package: name='com.attendpro.employee' versionCode='65' versionName='1.9.58'" employee-badging.txt
          grep -q "package: name='com.attendpro.store' versionCode='65' versionName='1.9.58'" store-badging.txt

      - name: Attempt permanent signing with approved previous key
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signed
          EXPECTED='6f8bcc08ae6c8d9654e7aa2c9a661fb6bdf21e31b720ab3add88aed0cd4f4d82'
          for V in ATTEND_PRO_KEYSTORE_B64 ATTEND_PRO_STORE_PASSWORD ATTEND_PRO_KEY_ALIAS ATTEND_PRO_KEY_PASSWORD; do
            if [ -z "${!V:-}" ]; then
              echo 'PERMANENT_SIGNING_AVAILABLE=false' | tee signing-status.txt
              echo "Missing approved signing secret: $V"
              exit 0
            fi
          done
          KEYSTORE=/tmp/attend-pro-permanent.jks
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ATTEND_PRO_STORE_PASSWORD" -alias "$ATTEND_PRO_KEY_ALIAS" >/dev/null
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for APP in employee store; do
            if [ "$APP" = employee ]; then MOD=employee-app; OUT=ATTEND-PRO-Employee-1.9.58-PERMANENT.apk; else MOD=store-app; OUT=ATTEND-PRO-Store-1.9.58-PERMANENT.apk; fi
            UNS=buildsrc/$MOD/build/outputs/apk/release/$MOD-release-unsigned.apk
            "$ZIPALIGN" -f -p 4 "$UNS" /tmp/$APP-aligned.apk
            "$APKSIGNER" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" \
              --ks-pass "env:ATTEND_PRO_STORE_PASSWORD" \
              --key-pass "env:ATTEND_PRO_KEY_PASSWORD" \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --out "signed/$OUT" /tmp/$APP-aligned.apk
            "$APKSIGNER" verify --verbose --print-certs "signed/$OUT" | tee "signed/$APP-signing.txt"
            ACTUAL=$("$APKSIGNER" verify --print-certs "signed/$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n1 | tr 'A-F' 'a-f')
            [ "$ACTUAL" = "$EXPECTED" ] || { echo "Permanent certificate mismatch for $APP"; exit 1; }
          done
          echo 'PERMANENT_SIGNING_AVAILABLE=true' | tee signing-status.txt
          sha256sum signed/*.apk | tee signed/SHA256SUMS.txt

      - name: Package verified source
        run: |
          set -euo pipefail
          (cd buildsrc && zip -qr ../ATTEND-PRO-V1-source-1.9.58-CONNECTION-STABILITY-GPS.zip . -x '.gradle/*' 'core/build/*' 'employee-app/build/*' 'store-app/build/*')
          sha256sum ATTEND-PRO-V1-source-1.9.58-CONNECTION-STABILITY-GPS.zip > source-sha256.txt
          cp /tmp/1958.patch ATTEND-PRO-1.9.58-CONNECTION-GPS.patch

      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Employee-1.9.58-DEBUG-TEST
          path: buildsrc/employee-app/build/outputs/apk/debug/employee-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Store-1.9.58-DEBUG-TEST
          path: buildsrc/store-app/build/outputs/apk/debug/store-app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.58-SIGNED-IF-AVAILABLE
          if-no-files-found: ignore
          path: signed/*
      - uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.58-VERIFICATION-SOURCE
          path: |
            ATTEND-PRO-V1-source-1.9.58-CONNECTION-STABILITY-GPS.zip
            ATTEND-PRO-1.9.58-CONNECTION-GPS.patch
            signing-status.txt
            employee-badging.txt
            store-badging.txt
            source-sha256.txt
