name: Build ATTEND-PRO 1.9.54 Installable APKs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-installable-1.9.54.yml'
      - '.source_patches/1.9.54/**'

permissions:
  contents: write
  actions: read

jobs:
  build-installable:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Reconstruct verified 1.9.54 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifact buildsrc final
          mkdir -p artifact buildsrc final
          gh run download 34022338830 -R "${{ github.repository }}" -n ATTEND-PRO-V1-source-1.9.52-v3 -D artifact
          unzip -q artifact/ATTEND-PRO-V1-source-1.9.52.zip -d buildsrc
          base64 -d .source_patches/1.9.53/base.patch.xz.b64 | xz -dc > /tmp/1953-base.patch
          (cd buildsrc && patch -p4 --batch < /tmp/1953-base.patch)
          base64 -d .source_patches/1.9.54/connection-compat.patch.xz.b64 | xz -dc > /tmp/1954.patch
          echo 'b95ebc7e77befcf7aad980be851e42590442579b682c1cce7da8e56f7abccf7f  /tmp/1954.patch' | sha256sum -c -
          (cd buildsrc && patch -p1 --batch < /tmp/1954.patch)
          grep -q 'versionCode = 61' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "1.9.54"' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionCode = 61' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "1.9.54"' buildsrc/store-app/build.gradle.kts

      - name: Run connection protocol tests
        run: gradle -p buildsrc :core:testDebugUnitTest --stacktrace

      - name: Build installable APKs
        run: gradle -p buildsrc :employee-app:assembleDebug :store-app:assembleDebug --stacktrace

      - name: Verify packages and signatures
        run: |
          set -euo pipefail
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          EMP="buildsrc/employee-app/build/outputs/apk/debug/employee-app-debug.apk"
          STORE="buildsrc/store-app/build/outputs/apk/debug/store-app-debug.apk"
          test -s "$EMP"
          test -s "$STORE"
          "$AAPT" dump badging "$EMP" | grep -q "versionCode='61' versionName='1.9.54'"
          "$AAPT" dump badging "$STORE" | grep -q "versionCode='61' versionName='1.9.54'"
          "$APKSIGNER" verify --verbose --print-certs "$EMP" | tee employee-signing.txt
          "$APKSIGNER" verify --verbose --print-certs "$STORE" | tee store-signing.txt
          cp "$EMP" final/ATTEND-PRO-Employee-1.9.54-INSTALLABLE-TEST.apk
          cp "$STORE" final/ATTEND-PRO-Store-1.9.54-INSTALLABLE-TEST.apk
          sha256sum final/*.apk | tee final/SHA256SUMS.txt
          cp employee-signing.txt store-signing.txt final/
          printf '%s\n' 'ATTEND-PRO 1.9.54 installable field-test build.' 'Built from the verified 1.9.54 source using Android debug signing because the permanent production signing secrets are currently unavailable.' 'If Android reports a signature conflict with an already installed ATTEND-PRO build, uninstall that build before installing this test APK.' > final/INSTALL-NOTE.txt

      - name: Upload Employee APK
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Employee-1.9.54-INSTALLABLE-TEST
          path: final/ATTEND-PRO-Employee-1.9.54-INSTALLABLE-TEST.apk

      - name: Upload Store APK
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-Store-1.9.54-INSTALLABLE-TEST
          path: final/ATTEND-PRO-Store-1.9.54-INSTALLABLE-TEST.apk

      - name: Upload verification bundle
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-1.9.54-INSTALLABLE-VERIFICATION
          path: final/

      - name: Publish installable test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.9.54-installable-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" final/* --repo "${{ github.repository }}" --title "ATTEND-PRO 1.9.54 Installable Test" --notes "Installable field-test APKs built from the verified ATTEND-PRO 1.9.54 source. Debug-signed because the permanent production signing secrets are unavailable."
