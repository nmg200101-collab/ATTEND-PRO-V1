name: Build ATTEND-PRO V2.0.0 FOUNDATION

on:
  workflow_dispatch:
  push:
    branches: [attend-pro-v2.0.0-foundation]

permissions:
  contents: read

concurrency:
  group: attend-pro-v2-foundation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-sign:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify branch, version, and immutable connection baseline
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b651ff153f82ed740109a76474b2e52708686fa0 HEAD
          grep -q 'versionCode = 90' buildsrc/store-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-FOUNDATION"' buildsrc/store-app/build.gradle.kts
          grep -q 'versionCode = 90' buildsrc/employee-app/build.gradle.kts
          grep -q 'versionName = "2.0.0-FOUNDATION"' buildsrc/employee-app/build.gradle.kts
          sha256sum -c CONNECTION_CORE_LOCK_V2_FOUNDATION.sha256
          python3 tools/guard-1.9.77-core-pairing.py snapshot
          python3 tools/guard-1.9.77-core-pairing.py verify

      - name: Verify production security contract
        run: |
          set -euo pipefail
          grep -q 'OFFICIAL_CERT_SHA256' buildsrc/core/src/main/java/com/attendpro/core/AppIntegrity1982.kt
          grep -q 'ENFORCE_OFFICIAL_SIGNATURE' buildsrc/store-app/build.gradle.kts
          grep -q 'ENFORCE_OFFICIAL_SIGNATURE' buildsrc/employee-app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' buildsrc/store-app/build.gradle.kts
          grep -q 'isShrinkResources = true' buildsrc/store-app/build.gradle.kts
          grep -q 'isMinifyEnabled = true' buildsrc/employee-app/build.gradle.kts
          grep -q 'isShrinkResources = true' buildsrc/employee-app/build.gradle.kts
          grep -q 'usesCleartextTraffic="false"' buildsrc/store-app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic="false"' buildsrc/employee-app/src/main/AndroidManifest.xml
          grep -q 'enforceOfficialBuild1982' buildsrc/store-app/src/main/java/com/attendpro/store/MainActivity.kt
          grep -q 'enforceOfficialBuild1982' buildsrc/employee-app/src/main/java/com/attendpro/employee/MainActivity.kt
          grep -q 'FLAG_SECURE' buildsrc/store-app/src/main/java/com/attendpro/store/SystemManagement1971Activity.kt
          grep -q 'activeInstrumentationDetected' buildsrc/store-app/src/main/java/com/attendpro/store/SystemManagement1971Activity.kt

      - name: Unit, integration, migration, messaging, attendance, and regression tests
        run: |
          set -euo pipefail
          gradle -p buildsrc :core:testDebugUnitTest :foundation:testDebugUnitTest :foundation:lintDebug --stacktrace
          python3 tools/guard-1.9.77-core-pairing.py verify
          sha256sum -c CONNECTION_CORE_LOCK_V2_FOUNDATION.sha256

      - name: Compile debug and build protected releases
        run: |
          set -euo pipefail
          gradle -p buildsrc \
            :employee-app:compileDebugKotlin :store-app:compileDebugKotlin \
            :employee-app:assembleDebug :store-app:assembleDebug \
            :employee-app:assembleRelease :store-app:assembleRelease --stacktrace
          test -s buildsrc/employee-app/build/outputs/mapping/release/mapping.txt
          test -s buildsrc/store-app/build/outputs/mapping/release/mapping.txt
          python3 tools/guard-1.9.77-core-pairing.py verify
          sha256sum -c CONNECTION_CORE_LOCK_V2_FOUNDATION.sha256

      - name: Sign official APKs and verify identity
        env:
          ATTEND_PRO_KEYSTORE_B64: ${{ secrets.ATTEND_PRO_KEYSTORE_B64 }}
          ATTEND_PRO_STORE_PASSWORD: ${{ secrets.ATTEND_PRO_STORE_PASSWORD }}
          ATTEND_PRO_KEY_ALIAS: ${{ secrets.ATTEND_PRO_KEY_ALIAS }}
          ATTEND_PRO_KEY_PASSWORD: ${{ secrets.ATTEND_PRO_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$ATTEND_PRO_KEYSTORE_B64"
          test -n "$ATTEND_PRO_STORE_PASSWORD"
          test -n "$ATTEND_PRO_KEY_ALIAS"
          test -n "$ATTEND_PRO_KEY_PASSWORD"
          mkdir -p signed
          EXPECTED_CERT=2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59
          KEYSTORE=/tmp/attend-pro-v2.jks
          printf '%s' "$ATTEND_PRO_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          for APP in employee store; do
            if [ "$APP" = employee ]; then
              MOD=employee-app
              PACKAGE=com.attendpro.employee
              OUT=ATTEND-PRO-Employee-V2.0.0-FOUNDATION.apk
            else
              MOD=store-app
              PACKAGE=com.attendpro.store
              OUT=ATTEND-PRO-Store-V2.0.0-FOUNDATION.apk
            fi
            UNSIGNED=buildsrc/$MOD/build/outputs/apk/release/$MOD-release-unsigned.apk
            test -s "$UNSIGNED"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -f -p 4 "$UNSIGNED" /tmp/$APP-aligned.apk
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias "$ATTEND_PRO_KEY_ALIAS" \
              --ks-pass "env:ATTEND_PRO_STORE_PASSWORD" \
              --key-pass "env:ATTEND_PRO_KEY_PASSWORD" \
              --v1-signing-enabled false \
              --v2-signing-enabled true \
              --v3-signing-enabled true \
              --out "signed/$OUT" "/tmp/$APP-aligned.apk"
            "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -p 4 "signed/$OUT"
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "signed/$OUT"
            ACTUAL_CERT=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "signed/$OUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr A-F a-f)
            test "$ACTUAL_CERT" = "$EXPECTED_CERT"
            "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "signed/$OUT" > "/tmp/$APP-badging.txt"
            grep -q "package: name='$PACKAGE' versionCode='90' versionName='2.0.0-FOUNDATION'" "/tmp/$APP-badging.txt"
          done
          (cd signed && sha256sum ./*.apk > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)

      - name: Package documentation and reproducible source backup
        run: |
          set -euo pipefail
          cp ARCHITECTURE_V2_FOUNDATION.md signed/
          cp MIGRATION_REPORT_V2_FOUNDATION.md signed/
          cp RELEASE_NOTES_V2.0.0_FOUNDATION.md signed/
          cp CONNECTION_CORE_LOCK_V2_FOUNDATION.sha256 signed/
          cp buildsrc/store-app/build/outputs/mapping/release/mapping.txt signed/STORE-R8-MAPPING-OWNER-ONLY.txt
          cp buildsrc/employee-app/build/outputs/mapping/release/mapping.txt signed/EMPLOYEE-R8-MAPPING-OWNER-ONLY.txt
          git archive --format=zip --prefix=ATTEND-PRO-V2.0.0-FOUNDATION/ \
            --output=signed/ATTEND-PRO-V2.0.0-FOUNDATION-SOURCE.zip HEAD
          {
            printf 'ATTEND-PRO V2.0.0-FOUNDATION\n'
            printf 'Source commit: %s\n' "$GITHUB_SHA"
            printf 'Workflow run: %s\n' "$GITHUB_RUN_ID"
            printf 'Protected baseline: b651ff153f82ed740109a76474b2e52708686fa0\n'
            printf 'Field pairing reference: ATTEND-PRO 1.9.70 STABLE BASE\n'
            printf 'Version code: 90\n'
            printf 'Official certificate SHA-256: 2fc214199b0c6e86f9cdd9288419fc143a119258c34f6a0ff70eed6aecb6fe59\n'
            printf 'Main branch merged: NO\n'
          } > signed/RELEASE-MANIFEST.txt
          (cd signed && find . -maxdepth 1 -type f ! -name ALL-SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > ALL-SHA256SUMS.txt)
          (cd signed && sha256sum -c ALL-SHA256SUMS.txt)

      - name: Upload signed foundation bundle
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-V2.0.0-FOUNDATION-SIGNED
          path: signed/*
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATTEND-PRO-V2.0.0-FOUNDATION-TEST-REPORTS
          path: |
            buildsrc/core/build/reports/tests/
            buildsrc/foundation/build/reports/tests/
            buildsrc/foundation/build/reports/lint-results-debug.html
          if-no-files-found: warn
          retention-days: 30
