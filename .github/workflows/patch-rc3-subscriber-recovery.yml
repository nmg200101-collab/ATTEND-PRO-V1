name: RC3 one-shot subscriber recovery patch

on:
  push:
    branches: [attend-pro-v2.0.0-rc2-play-compliance]
    paths:
      - '.github/workflows/patch-rc3-subscriber-recovery.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: attend-pro-v2.0.0-rc2-play-compliance
          fetch-depth: 0
      - name: Apply subscriber recovery UI patch
        run: |
          set -euo pipefail
          python3 tools/patch_rc3_subscriber_recovery.py
          git diff --check
          grep -q 'بيانات الدخول والاستعادة' buildsrc/store-app/src/main/java/com/attendpro/store/SystemManagement1971Activity.kt
          grep -q '/api/v1/admin/stores/recovery-grant' buildsrc/store-app/src/main/java/com/attendpro/store/SystemManagement1971Activity.kt
          git config user.name 'attend-pro-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add buildsrc/store-app/src/main/java/com/attendpro/store/SystemManagement1971Activity.kt
          git diff --cached --quiet && exit 0
          git commit -m 'RC3: add one-time subscriber recovery credential UI'
          git push origin HEAD:attend-pro-v2.0.0-rc2-play-compliance
